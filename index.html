<script>
(function () {
'use strict';
// ---- src/engine.js ----
// Pure calculation engine: dates, computed values (SPEC 3), scoring (SPEC 4), calculators (SPEC 5).
// No DOM access. Dates are ISO strings "YYYY-MM-DD"; months are "YYYY-MM".

// ---------- dates ----------
const ISO_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
const MONTH_RE = /^(\d{4})-(\d{2})$/;
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
  'August', 'September', 'October', 'November', 'December'];

const pad = (n, w = 2) => String(n).padStart(w, '0');

function isLeapYear(y) {
  return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
}

function daysInMonth(y, m) {
  return [31, isLeapYear(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
}

function isValidDate(s) {
  const r = ISO_RE.exec(s || '');
  if (!r) return false;
  const y = +r[1], m = +r[2], d = +r[3];
  return m >= 1 && m <= 12 && d >= 1 && d <= daysInMonth(y, m);
}

function isValidMonth(s) {
  const r = MONTH_RE.exec(s || '');
  return !!r && +r[2] >= 1 && +r[2] <= 12;
}

function parseDate(s) {
  if (!isValidDate(s)) throw new Error('Bad date: ' + s);
  const [y, m, d] = s.split('-').map(Number);
  return { y, m, d };
}

function makeDate(y, m, d) {
  return `${pad(y, 4)}-${pad(m)}-${pad(d)}`;
}

function firstOfMonth(s) {
  const { y, m } = parseDate(s);
  return makeDate(y, m, 1);
}

function lastOfMonth(s) {
  const { y, m } = parseDate(s);
  return makeDate(y, m, daysInMonth(y, m));
}

function monthToFirst(month) {
  if (!isValidMonth(month)) throw new Error('Bad month: ' + month);
  return month + '-01';
}

function monthToLast(month) {
  return lastOfMonth(monthToFirst(month));
}

// "+Nm" rule (CLAUDE_CODE_PROMPT requirement 3): a month-end date maps to the target month's end;
// any other date keeps its day, clamped to the target month's length.
function addMonths(s, n) {
  const { y, m, d } = parseDate(s);
  const idx = y * 12 + (m - 1) + n;
  const ty = Math.floor(idx / 12), tm = (idx % 12) + 1;
  const dim = daysInMonth(ty, tm);
  const day = d === daysInMonth(y, m) ? dim : Math.min(d, dim);
  return makeDate(ty, tm, day);
}

function addDays(s, n) {
  const { y, m, d } = parseDate(s);
  const t = new Date(Date.UTC(y, m - 1, d) + n * 86400000);
  return makeDate(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
}

function yearOf(s) { return parseDate(s).y; }
function monthOf(s) { return parseDate(s).m; }
const maxDate = (a, b) => (a > b ? a : b);
const minDate = (a, b) => (a < b ? a : b);

// Whole months from a to b, counting any partial month as a full month (so a short gap is never 0).
function monthsCeil(a, b) {
  const A = parseDate(a), B = parseDate(b);
  let n = (B.y - A.y) * 12 + (B.m - A.m);
  if (B.d > A.d) n += 1;
  return n;
}

function formatDate(s) {
  const { y, m, d } = parseDate(s);
  return `${MONTH_NAMES[m - 1]} ${d}, ${y}`;
}

function formatMonth(month) {
  const [y, m] = month.split('-').map(Number);
  return `${MONTH_NAMES[m - 1]} ${y}`;
}

// ---------- money ----------
// Work in integer cents to avoid floating-point drift.
const toCents = (usd) => Math.round(usd * 100);

function formatUSD(usd, opts = {}) {
  const cents = toCents(usd);
  const whole = cents % 100 === 0 && !opts.cents;
  const abs = Math.abs(cents);
  const dollars = Math.floor(abs / 100).toLocaleString('en-US');
  const out = whole ? `$${dollars}` : `$${dollars}.${pad(abs % 100)}`;
  return cents < 0 ? '-' + out : out;
}

// Round cents to the nearest 10 cents (Medicare penalty rounding).
const roundToDime = (cents) => Math.round(cents / 10) * 10;

// ---------- facts ----------
function indexFacts(factsDoc) {
  const map = {};
  for (const f of factsDoc.facts) map[f.id] = f;
  Object.defineProperty(map, '__meta', { value: factsDoc.meta || {}, enumerable: false });
  return map;
}

function isStale(fact, today) {
  return !!(fact && fact.review_after && today > fact.review_after);
}

// Pick a year-keyed fact (prefix_YYYY) for `year`, falling back to the latest earlier year.
function pickYearFact(facts, prefix, year) {
  const re = new RegExp('^' + prefix + '_(\\d{4})$');
  let best = null;
  for (const id of Object.keys(facts)) {
    const r = re.exec(id);
    if (!r) continue;
    const y = +r[1];
    if (y <= year && (!best || y > best.year)) best = { year: y, fact: facts[id] };
  }
  if (!best) return null;
  return { ...best, placeholder: best.year !== year };
}

// Pick a value from a fact whose value is keyed by year ({"2026": 2950, "2027": 3050}).
function pickYearKey(obj, year) {
  const years = Object.keys(obj).map(Number).filter((y) => y <= year);
  if (!years.length) return null;
  const y = Math.max(...years);
  return { year: y, value: obj[y], placeholder: y !== year };
}

// ---------- computed values (SPEC 3) ----------
const known = (v) => v !== undefined && v !== null && v !== '' && v !== 'unknown' && v !== 'default';

function wifeMedicareStart(birth) {
  const { y, m, d } = parseDate(birth);
  const start = makeDate(y + 65, m, 1);
  return d === 1 ? addMonths(start, -1) : start;
}

function gcnjWindowBefore(facts, jobCovEnd, today) {
  const base = facts.gcnj_oe_2027 && facts.gcnj_oe_2027.value;
  if (!base) return null;
  let pick = null;
  for (let k = -1; k <= 10; k++) {
    const start = addMonths(base.start, 12 * k), end = addMonths(base.end, 12 * k);
    // The latest window that opens by the day job coverage ends (and has not closed yet): its prices
    // are the ones she would pay right after, and she can still enroll in it before the coverage ends.
    if (start <= jobCovEnd && end >= today) pick = { start, end, assumed: k !== 0 };
  }
  return pick;
}

const LABEL = {
  job_cov_end: ['INFERRED', 'high', 'Your answer.'],
  wife_medicare_start: ['INFERRED', 'high', 'First day of her 65th-birthday month; if born on the 1st, the month before (fact medicare_start_month).'],
  his_entitlement: ['INFERRED', 'medium', 'Your Part A start date.'],
  part_a_projected_start: ['INFERRED', 'medium', 'Part A starts 6 months back from the month you sign up, assumed to be the sign-up month on your to-do list (fact parta_retro).'],
  parta_signup_by: ['ASSUMED', null, 'The end of the month two weeks from today, leaving time to check with HR first. A guide timing choice, not a Medicare rule.'],
  parta_signup_earliest_for_36: ['INFERRED', 'medium', 'The first sign-up month whose backdated Part A start (6 months earlier) is less than 18 months before your last day of work (facts parta_retro, cobra_36_month_rule).'],
  parta_signup_latest_for_36: ['INFERRED', 'medium', 'The month you stop working: a later sign-up could start Part A after you retire, which the 36-month rule does not count (facts parta_retro, cobra_36_month_rule).'],
  wife_cobra_end_if_parta_latest: ['INFERRED', 'medium', 'Part A start for a sign-up in the latest month (6 months back) + 36 months - 1 day (facts parta_retro, cobra_36_month_rule).'],
  drug_enroll_by_no_gap: ['INFERRED', 'high', 'Last day of the month before the month that contains the day after your job coverage ends, so the plan starts on the 1st with no gap (fact partd_sep_effective_date).'],
  drug_enroll_by_no_penalty: ['INFERRED', 'high', 'The last day you can join so the plan starts (on the 1st of the next month) before a 63-day gap, and within your enrollment window (facts partd_penalty, partd_sep_effective_date, ma_pd_sep_employer_loss).'],
  nj_gi_window_close: ['INFERRED', 'medium', 'Job coverage end + 63 days (fact gi_nj_state_extension, which is UNVERIFIED).'],
  ssa44_date: ['INFERRED', 'medium', 'The later of January 1 of your first Part B year and the first day of the month after you stop working: a work-stoppage request can only be made after work stops (fact lce_effective).'],
  wife_partb_start: ['INFERRED', 'high', "The first day of the month that contains the day after your job coverage ends (her Part B starts the same way as yours; fact partb_sep_start_date)."],
  wife_partb_file_by: ['INFERRED', 'medium', 'Her Part B start - 2 months (the same lead time as yours).'],
  wife_medigap_window_close: ['INFERRED', 'high', 'Her Part B start + 6 months - 1 day (fact medigap_oep).'],
  months_until_retire: ['INFERRED', 'medium', 'Months from today until your job coverage ends.'],
  cobra36_eligible: ['INFERRED', 'medium', 'Part A start is before your last day of work and less than 18 months before it (fact cobra_36_month_rule).'],
  wife_cobra_end: ['INFERRED', 'medium', 'Job coverage end + 18 months, or Part A start + 36 months - 1 day if the 36-month rule applies, whichever is later. Confirm with the plan administrator.'],
  bridge_months: ['INFERRED', 'medium', 'Months from the day after your job coverage ends to her Medicare start (any part month counts as a month).'],
  cobra_gap_months: ['INFERRED', 'medium', 'Months from the day after her COBRA ends to her Medicare start (any part month counts as a month).'],
  retire_by_for_36: ['INFERRED', 'medium', 'Projected Part A start + 18 months - 1 day.'],
  wife_cobra_end_if_parta_now: ['INFERRED', 'medium', 'Projected Part A start + 36 months - 1 day.'],
  partb_start: ['INFERRED', 'high', 'The first day of the month that contains the day after your job coverage ends (Part B always starts on the 1st). Fact partb_sep_start_date.'],
  partb_file_by: ['INFERRED', 'medium', 'Part B start - 2 months (Medicare says about 1 month; 2 adds time for the CMS-L564 signature).'],
  ma_window_open: ['INFERRED', 'high', 'Part B start - 3 months (fact ma_window_new_to_b).'],
  ma_window_close: ['INFERRED', 'high', 'End of the 2nd full month after the month your job coverage ends (fact ma_pd_sep_employer_loss).'],
  drug_deadline: ['INFERRED', 'high', 'Job coverage end + 63 days (facts partd_penalty, creditable_notice).'],
  medigap_window_close: ['INFERRED', 'high', 'Part B start + 6 months - 1 day (fact medigap_oep).'],
  medigap_window_open: ['INFERRED', 'high', 'Compares today with the end of your 6-month Medigap window.'],
  partb_sep_end: ['INFERRED', 'high', 'End of the 8th month after the month your job or job coverage ends, whichever is earlier (fact partb_sep).'],
  irmaa_first_year_jan: ['INFERRED', 'medium', 'January 1 of the year your Part B starts.'],
  gcnj_oe_before_retire: ['INFERRED', 'medium', 'The last Get Covered NJ open enrollment (Nov 1 - Jan 31) that opens by the day your job coverage ends (fact gcnj_oe_2027).']
};

// answers: effective answers on the current path. today: ISO date.
// Returns { values, meta, notes, questions } where meta[name] = {label, confidence, how}.
function compute(answers, facts, today) {
  const a = answers || {};
  const v = { as_of: (facts.__meta && facts.__meta.as_of) || null, today, gi_right: false };
  const meta = {};
  const notes = []; // {needs, for}
  const questions = [];
  const set = (name, value, overrides) => {
    v[name] = value;
    const [label, confidence, how] = LABEL[name] || ['INFERRED', 'medium', ''];
    meta[name] = { label, confidence, how, ...(overrides || {}) };
  };

  // Job coverage end
  let lastDayWorked = null;
  if (isValidMonth(a.last_work_month)) {
    lastDayWorked = monthToLast(a.last_work_month);
    v.last_day_worked = lastDayWorked;
  }
  if (isValidDate(a.job_cov_end)) {
    v.job_cov_end = a.job_cov_end; // the user's own answer: no estimate badge
  } else if (lastDayWorked) {
    set('job_cov_end', lastDayWorked, { label: 'ASSUMED', confidence: null,
      how: 'Assumed to be the last day of the month you stop working (fact his_coverage_end_assumption). Confirm with HR.' });
  }
  const jce = v.job_cov_end || null;

  // Wife's Medicare start
  if (isValidDate(a.wife_birth)) set('wife_medicare_start', wifeMedicareStart(a.wife_birth));

  // UX review H1: the Part A card date can change the wife's COBRA only through the 36-month rule, which
  // needs the last day worked within 18 months after the Part A start. A card's start date is at most a few
  // months ahead (cards arrive before coverage starts; 3 months allowed), so if he stops working 21 or more
  // months after this month starts, no card date can matter and the question is skipped.
  v.parta_date_can_matter = lastDayWorked ? lastDayWorked < addMonths(firstOfMonth(today), 21) : true;

  // Part A
  if (a.part_a === 'no') {
    // "Now" = by the end of the month two weeks out (after the HR check), so the action date and the
    // projected start use the same sign-up month.
    const signupBy = lastOfMonth(addDays(today, 14));
    const pps = addMonths(firstOfMonth(signupBy), -6);
    set('parta_signup_by', signupBy);
    set('part_a_projected_start', pps);
    set('retire_by_for_36', addDays(addMonths(pps, 18), -1));
    set('wife_cobra_end_if_parta_now', addDays(addMonths(pps, 36), -1));
    set('his_entitlement', pps, { how: 'Projected Part A start if you sign up by ' + formatDate(signupBy) + '.' });
    if (lastDayWorked) {
      // C1: retiring after the cutoff, a sign-up now is too early for the 36-month rule. A sign-up month M
      // (start M - 6 months) qualifies when that start is < 18 months before the last day worked.
      v.retire_after_36_cutoff = lastDayWorked > v.retire_by_for_36;
      if (v.retire_after_36_cutoff) {
        const latest = firstOfMonth(lastDayWorked);
        const earliest = addMonths(latest, -11);
        // X2: these are months (any day in the month works), shown as "December 2027".
        set('parta_signup_earliest_for_36', earliest, { format: 'month' });
        set('parta_signup_latest_for_36', latest, { format: 'month' });
        set('wife_cobra_end_if_parta_latest', addDays(addMonths(addMonths(latest, -6), 36), -1));
      }
    }
  } else if (isValidMonth(a.part_a_date)) {
    set('his_entitlement', monthToFirst(a.part_a_date));
  } else if (a.part_a === 'yes' && a.part_a_date === undefined && v.parta_date_can_matter === false) {
    // Not asked: no card date could change anything (see parta_date_can_matter above).
    v.his_entitlement = null;
    meta.his_entitlement = { label: 'INFERRED', confidence: 'high',
      how: 'Not needed: you stop working more than 18 months after any Part A start date your card could show.' };
  } else if (a.part_a === 'yes') {
    // Date unknown: treat as more than 18 months before retirement (no 36-month rule).
    v.his_entitlement = null;
    v.entitlement_assumed = true;
    meta.his_entitlement = { label: 'ASSUMED', confidence: null, unknown: true,
      how: 'Part A date not known: assumed to be more than 18 months before you retire, so the 36-month COBRA rule is not used. Ask Social Security.' };
    questions.push('Q_SSA_STATUS');
  }
  if (v.his_entitlement) v.part_a_date_display = v.his_entitlement;

  // COBRA for wife
  if (jce && lastDayWorked) {
    const ent = v.his_entitlement;
    const c36 = !!ent && ent < lastDayWorked && lastDayWorked < addMonths(ent, 18);
    set('cobra36_eligible', c36);
    const base = addMonths(jce, 18);
    const end = c36 ? maxDate(base, addDays(addMonths(ent, 36), -1)) : base;
    set('wife_cobra_end', end, v.entitlement_assumed ? { label: 'ASSUMED', confidence: null,
      how: 'Job coverage end + 18 months (your Part A date is unknown, so the 36-month rule was not used).' } : undefined);
    v.wife_cobra_rule = c36
      ? '36-month rule (you became entitled to Medicare less than 18 months before retiring)'
      : '18-month rule';
  }
  if (jce && v.wife_medicare_start) {
    set('bridge_months', monthsCeil(addDays(jce, 1), v.wife_medicare_start));
    if (v.wife_cobra_end) set('cobra_gap_months', monthsCeil(addDays(v.wife_cobra_end, 1), v.wife_medicare_start));
  }
  // H2: she reaches Medicare while still on his job plan, so she signs up for Part B when it ends, as he does.
  v.wife_on_medicare_at_retire = !!(jce && v.wife_medicare_start && a.wife_on_his_plan === 'yes' && v.wife_medicare_start <= jce);
  if (v.wife_on_medicare_at_retire) {
    const ws = firstOfMonth(addDays(jce, 1));
    set('wife_partb_start', ws);
    set('wife_partb_file_by', addMonths(ws, -2));
    set('wife_medigap_window_close', addDays(addMonths(ws, 6), -1));
  }
  if (jce) set('months_until_retire', Math.max(0, monthsCeil(today, jce)));

  // Part B
  if (a.part_b === 'yes') {
    if (isValidMonth(a.part_b_date)) {
      set('partb_start', monthToFirst(a.part_b_date), { how: 'Your Part B start date from your card.' });
    }
  } else if (jce) {
    const ps = firstOfMonth(addDays(jce, 1));
    set('partb_start', ps);
    set('partb_file_by', addMonths(ps, -2));
    set('ma_window_open', addMonths(ps, -3));
  }
  if (jce) {
    set('ma_window_close', lastOfMonth(addMonths(firstOfMonth(jce), 2)));
    set('drug_deadline', addDays(jce, 63));
    // C2: a drug plan starts on the 1st of the month after you join (fact partd_sep_effective_date).
    const gapStart = addDays(jce, 1);
    const gapDays = facts.partd_penalty.value.gap_days;
    set('drug_enroll_by_no_gap', addDays(firstOfMonth(gapStart), -1));
    set('drug_enroll_by_no_penalty', minDate(addDays(firstOfMonth(addDays(gapStart, gapDays - 1)), -1), v.ma_window_close));
    const endedFirst = lastDayWorked ? minDate(lastDayWorked, jce) : jce;
    set('partb_sep_end', lastOfMonth(addMonths(firstOfMonth(endedFirst), 8)));
  }

  // Medigap window
  if (v.partb_start) set('medigap_window_close', addDays(addMonths(v.partb_start, 6), -1));
  if (a.part_b === 'no' || (a.part_b === undefined && a.part_a === 'no')) {
    set('medigap_window_open', true);
    v.medigap_window_status = v.medigap_window_close
      ? `is still open until ${formatDate(v.medigap_window_close)}` : 'opens when your Part B starts';
  } else if (a.part_b === 'yes') {
    if (v.medigap_window_close) {
      const open = today <= v.medigap_window_close;
      set('medigap_window_open', open);
      v.medigap_window_status = open
        ? `is still open until ${formatDate(v.medigap_window_close)}`
        : `closed on ${formatDate(v.medigap_window_close)}`;
    } else {
      set('medigap_window_open', 'unknown', { how: 'Your Part B start date is not known.' });
      v.medigap_window_status = "can't be determined — ask NJ SHIP";
      questions.push('Q_SHIP_GI_PRIMARY');
    }
  }
  // C3: New Jersey's 63-day right after leaving a job plan that pays first (UNVERIFIED-high).
  if (a.part_b === 'yes' && v.medigap_window_open !== true && jce && facts.gi_nj_state_extension) {
    set('nj_gi_window_close', addDays(jce, facts.gi_nj_state_extension.value.window_days_after));
  }

  // IRMAA first January
  if (v.partb_start) {
    const y = yearOf(v.partb_start);
    set('irmaa_first_year_jan', makeDate(y, 1, 1));
    if (monthOf(v.partb_start) >= 10) v.irmaa_second_year_jan = makeDate(y + 1, 1, 1);
    // H1: a work-stoppage request can be made only after work stops (POMS HI 01120.005 B).
    set('ssa44_date', lastDayWorked ? maxDate(v.irmaa_first_year_jan, firstOfMonth(addMonths(lastDayWorked, 1))) : v.irmaa_first_year_jan);
  }
  // Year for yearly dollar figures ({{fig:...}}): the year Part B starts, never earlier than this year.
  v.decision_year = Math.max(v.partb_start ? yearOf(v.partb_start) : yearOf(today), yearOf(today));

  // Get Covered NJ window before retirement
  if (jce) {
    const w = gcnjWindowBefore(facts, jce, today);
    if (w) {
      set('gcnj_oe_before_retire', maxDate(w.start, today), w.assumed
        ? { label: 'ASSUMED', confidence: null, how: `Assumes Get Covered NJ keeps the same Nov 1 - Jan 31 dates in later years (only the 2026-27 dates are published).` }
        : undefined);
      v.gcnj_window = w;
    }
  }

  // Scoring (SPEC 4)
  const score = pathScore(a, v.medigap_window_open, facts);
  v.path_score = score.total;
  v.path_score_reasons = score.reasons;
  meta.path_score = { label: 'ASSUMED', confidence: null, how: 'Design weights (fact path_score_weights), not a Medicare rule.' };

  // Needs
  if (!jce) notes.push('the month you plan to stop working');
  if (!v.wife_medicare_start) notes.push("your wife's date of birth");

  return { values: v, meta, notes, questions };
}

// ---------- scoring (SPEC 4) ----------
function pathScore(a, windowOpen, facts) {
  const w = facts.path_score_weights.value;
  const reasons = [];
  const add = (name, answer, pts) => reasons.push({ name, answer, points: pts });
  for (const name of ['health_needs', 'doctor_choice', 'travel', 'predictability', 'budget_ok']) {
    const ans = a[name];
    if (ans === undefined) continue;
    add(name, ans, (w[name] && w[name][ans]) || 0);
  }
  if (windowOpen === true && a.health_needs === 'yes') add('reversibility', 'window open and health needs', w.reversibility);
  const total = reasons.reduce((s, r) => s + r.points, 0);
  return { total, reasons };
}

// ---------- IRMAA (SPEC 5a) ----------
// Whole-dollar MAGI; tiers use the table's inclusive min/max, which encode CMS's exact
// "greater than" / "less than or equal" wording (boundary_note).
function irmaaTier(table, magi) {
  const m = Math.round(magi);
  for (const row of table) {
    if (m >= row.joint_magi_min && (row.joint_magi_max === null || m <= row.joint_magi_max)) return row;
  }
  return null;
}

function irmaaTableFor(facts, premiumYear) {
  const pick = pickYearFact(facts, 'irmaa_table', premiumYear);
  if (!pick) return null;
  return { table: pick.fact.value, tableYear: pick.year, placeholder: pick.placeholder, factId: pick.fact.id };
}

function monthsInYear(startIso, year) {
  if (!startIso) return 0;
  const y = yearOf(startIso);
  if (y < year) return 12;
  if (y > year) return 0;
  return 13 - monthOf(startIso);
}

const monthlySurchargeCents = (row) => toCents(row.partb_irmaa) + toCents(row.partd_irmaa);

// inputs: { partbStart, wifeMedicareStart, wifeHasB, lastWorkMonth, magi: {year: n}, oneTime: {year: n}, lastYear }
function irmaaSchedule(facts, inputs) {
  const rows = [];
  if (!inputs.partbStart) return rows;
  const firstYear = yearOf(inputs.partbStart);
  const lastYear = inputs.lastYear || 2031;
  const margin = facts.irmaa_cliff_margin ? facts.irmaa_cliff_margin.value : 0;
  const lastWorkYear = inputs.lastWorkMonth ? +inputs.lastWorkMonth.slice(0, 4) : null;
  const lastFullSalaryYear = inputs.lastWorkMonth
    ? (+inputs.lastWorkMonth.slice(5, 7) === 12 ? lastWorkYear : lastWorkYear - 1) : null;
  for (let Y = firstYear; Y <= lastYear; Y++) {
    const t = irmaaTableFor(facts, Y);
    const taxYear = Y - 2;
    const himMonths = monthsInYear(inputs.partbStart, Y);
    const wifeMonths = inputs.wifeHasB ? monthsInYear(inputs.wifeMedicareStart, Y) : 0;
    const row = { year: Y, taxYear, himMonths, wifeMonths, tableYear: t && t.tableYear,
      placeholder: t ? t.placeholder : true, factId: t && t.factId };
    const magi = inputs.magi ? inputs.magi[taxYear] : undefined;
    if (!t || magi === undefined || magi === null || magi === '') {
      row.missing = `income estimate for ${taxYear}`;
      rows.push(row);
      continue;
    }
    const tier = irmaaTier(t.table, +magi);
    row.magi = +magi;
    row.tier = tier.tier;
    row.surchargeCents = (himMonths + wifeMonths) * monthlySurchargeCents(tier);
    row.surcharge = row.surchargeCents / 100;
    // Cliff warning: within `margin` of the income where the next tier starts.
    const next = t.table.find((r) => r.tier === tier.tier + 1);
    if (next && next.joint_magi_min - row.magi <= margin) {
      row.cliff = { nextMin: next.joint_magi_min,
        stepPerPersonYear: (12 * (monthlySurchargeCents(next) - monthlySurchargeCents(tier))) / 100 };
    }
    // Appeal (life-changing event: work stoppage)
    const appealable = lastWorkYear !== null && taxYear <= lastWorkYear && Y >= lastFullSalaryYear + 1;
    row.appealable = appealable;
    if (appealable) {
      const newer = inputs.magi ? inputs.magi[Y] : undefined;
      if (newer === undefined || newer === null || newer === '') {
        row.appealMissing = `income estimate for ${Y}`;
      } else {
        const at = irmaaTier(t.table, +newer);
        row.appealTier = at.tier;
        row.appealSurchargeCents = (himMonths + wifeMonths) * monthlySurchargeCents(at);
        row.appealSurcharge = row.appealSurchargeCents / 100;
        const oneTime = inputs.oneTime ? +(inputs.oneTime[Y] || 0) : 0;
        row.appealOneTime = oneTime; // still counted in year Y; cannot be appealed
      }
    }
    rows.push(row);
  }
  return rows;
}

// ---------- late penalties (SPEC 5b) ----------
function partBPenalty(facts, monthsLate, year) {
  const prem = pickYearFact(facts, 'partb_premium', year);
  const pct = facts.partb_penalty.value.pct_per_full_12_months * Math.floor(monthsLate / 12);
  const baseCents = toCents(prem.fact.value);
  const cents = roundToDime((baseCents * (100 + pct)) / 100);
  return { pct, monthly: cents / 100, premiumYear: prem.year, placeholder: prem.placeholder, factId: prem.fact.id };
}

function partDPenalty(facts, monthsWithout, year) {
  const base = pickYearFact(facts, 'partd_base', year);
  const pct = facts.partd_penalty.value.pct_per_month;
  const cents = roundToDime((toCents(base.fact.value) * monthsWithout * pct) / 100);
  return { monthly: cents / 100, baseYear: base.year, placeholder: base.placeholder, factId: base.fact.id };
}

// ---------- Medigap compare (SPEC 5c) ----------
// inputs: { g, n, hdg (monthly premiums), office, er, excess, yearType: healthy|moderate|bad, year }
function medigapCompare(facts, inputs) {
  const types = facts.medigap_compare_year_types.value;
  const year = inputs.year;
  const partA = pickYearFact(facts, 'parta_deductible', year);
  const partB = pickYearFact(facts, 'partb_deductible', year);
  const hd = pickYearKey(facts.hdg_deductible.value, year);
  const copay = facts.plan_n_differences.value;
  const costSharing = inputs.yearType === 'healthy' ? types.healthy
    : inputs.yearType === 'bad' ? partA.fact.value + types.bad_extra : types.moderate;
  const excess = +inputs.excess || 0;
  const bDed = Math.min(costSharing, partB.fact.value);
  const out = { costSharing, partBDeductible: partB.fact.value, hdDeductible: hd.value,
    placeholders: { partB: partB.placeholder ? partB.year : null, partA: partA.placeholder ? partA.year : null,
      hd: hd.placeholder ? hd.year : null } };
  const yearly = (monthly, oop) => (monthly === '' || monthly === undefined || monthly === null || isNaN(+monthly))
    ? null : (toCents(12 * +monthly) + toCents(oop)) / 100;
  out.g = yearly(inputs.g, bDed);
  out.n = yearly(inputs.n, bDed + copay.office_copay * (+inputs.office || 0) + copay.er_copay * (+inputs.er || 0) + excess);
  out.hdg = yearly(inputs.hdg, Math.min(costSharing + excess, hd.value));
  return out;
}

// ---- src/interpreter.js ----
// Pure tree interpreter: conditions, routes, path walking, actions, questions and the {{ }} token renderer.
// No DOM access and no eval.


// ---------- conditions ----------
function evalClause(c, vars) {
  const x = vars[c.var];
  const isSet = x !== undefined && x !== null;
  switch (c.op) {
    case 'eq': return isSet && x === c.value;
    case 'ne': return x !== c.value;
    case 'in': return isSet && Array.isArray(c.value) && c.value.includes(x);
    case 'lt': return typeof x === 'number' && x < c.value;
    case 'lte': return typeof x === 'number' && x <= c.value;
    case 'gt': return typeof x === 'number' && x > c.value;
    case 'gte': return typeof x === 'number' && x >= c.value;
    case 'set': return isSet;
    case 'unset': return !isSet;
    default: throw new Error('Unknown op: ' + c.op);
  }
}

const evalWhen = (when, vars) => !when || when.every((c) => evalClause(c, vars));

function pickRoute(route, vars) {
  for (const entry of route) if (evalWhen(entry.when, vars)) return entry;
  return null;
}

// ---------- tokens ----------
const TOKEN_RE = /\{\{\s*([^}]+?)\s*\}\}/g;

function resolveFactPath(facts, ref) {
  const [id, ...path] = ref.split('.');
  const fact = facts[id];
  if (!fact) return { ok: false, id };
  if (!path.length) return { ok: true, id, fact, whole: true };
  let v = fact;
  for (const key of path) {
    if (v === null || typeof v !== 'object' || !(key in v)) return { ok: false, id, fact };
    v = v[key];
  }
  return { ok: true, id, fact, value: v, path: path.join('.') };
}

// {{fig:prefix.path}}: a yearly dollar figure for `year`. Uses the year-keyed fact prefix_YYYY, or a fact
// `prefix` whose value is keyed by year, falling back to the latest earlier year (a placeholder).
function resolveFigure(facts, ref, year) {
  const [prefix, ...path] = ref.split('.');
  let fact, figYear, value;
  // Only later years published (e.g. a 2027 limit viewed in 2026): use the earliest of them.
  const firstYear = (years) => years.length ? Math.min(...years) : null;
  const re = new RegExp('^' + prefix + '_(\\d{4})$');
  const idYears = Object.keys(facts).map((id) => (re.exec(id) || [])[1]).filter(Boolean).map(Number);
  const byId = pickYearFact(facts, prefix, year) || (idYears.length
    ? { fact: facts[`${prefix}_${firstYear(idYears)}`], year: firstYear(idYears) } : null);
  if (byId) { fact = byId.fact; figYear = byId.year; value = fact.value; }
  else if (facts[prefix] && facts[prefix].value && typeof facts[prefix].value === 'object') {
    const obj = facts[prefix].value;
    const k = pickYearKey(obj, year) || { year: firstYear(Object.keys(obj).map(Number)), value: obj[firstYear(Object.keys(obj).map(Number))] };
    if (k.year === null) return { ok: false };
    fact = facts[prefix]; figYear = k.year; value = k.value;
  } else return { ok: false };
  for (const key of path) {
    if (value === null || typeof value !== 'object' || !(key in value)) return { ok: false };
    value = value[key];
  }
  if (typeof value !== 'number') return { ok: false };
  return { ok: true, id: fact.id, value, year: figYear, placeholder: figYear !== year };
}

function figureText(r, year) {
  if (!r.placeholder) return `${formatUSD(r.value)} (${r.year})`;
  return r.year < year ? `${formatUSD(r.value)} (${r.year} figure; the ${year} amount isn't published yet)`
    : `${formatUSD(r.value)} (${r.year} figure)`;
}

// Value inside a fact: numbers are dollars; ISO dates and months are spelled out.
function formatFactValue(v) {
  if (typeof v === 'number') return formatUSD(v);
  if (typeof v === 'string') return formatVarValue(v);
  return null;
}

function formatVarValue(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v === 'number') return String(v);
  if (typeof v === 'string') {
    if (isValidDate(v)) return formatDate(v);
    if (isValidMonth(v)) return formatMonth(v);
    return v;
  }
  return null;
}

const NOT_ENTERED = '[not entered yet]';

// ctx: { facts, vars, meta, log(msg) }. Returns segments for the UI.
function renderSegments(text, ctx) {
  const segs = [];
  if (typeof text !== 'string') return segs;
  let last = 0;
  for (const m of text.matchAll(TOKEN_RE)) {
    if (m.index > last) segs.push({ type: 'text', text: text.slice(last, m.index) });
    last = m.index + m[0].length;
    const tok = m[1];
    if (tok.startsWith('fact:')) {
      const r = resolveFactPath(ctx.facts, tok.slice(5));
      if (!r.ok) {
        ctx.log && ctx.log(`Unresolved fact token {{${tok}}}`);
        segs.push({ type: 'text', text: NOT_ENTERED, unresolved: tok });
        continue;
      }
      const shown = r.whole ? r.fact.plain.replace(/([^.!?)])$/, '$1.') : formatFactValue(r.value);
      if (shown === null) {
        ctx.log && ctx.log(`Fact value not displayable {{${tok}}}`);
        segs.push({ type: 'text', text: NOT_ENTERED, unresolved: tok });
        continue;
      }
      segs.push({ type: 'fact', id: r.id, whole: !!r.whole, text: shown });
    } else if (tok.startsWith('fig:')) {
      const year = (ctx.vars && ctx.vars.decision_year) || +String((ctx.vars && ctx.vars.today) || '').slice(0, 4);
      const r = resolveFigure(ctx.facts, tok.slice(4), year);
      if (!r.ok) {
        ctx.log && ctx.log(`Unresolved figure token {{${tok}}}`);
        segs.push({ type: 'text', text: NOT_ENTERED, unresolved: tok });
        continue;
      }
      segs.push({ type: 'fact', id: r.id, whole: false, text: figureText(r, year), placeholder: r.placeholder });
    } else {
      const name = tok;
      const raw = ctx.vars[name];
      let shown = formatVarValue(raw);
      if (ctx.meta && ctx.meta[name] && ctx.meta[name].format === 'month' && isValidDate(raw)) shown = formatMonth(raw.slice(0, 7));
      if (raw === 'unknown' || (shown === null && ctx.meta && ctx.meta[name] && ctx.meta[name].unknown)) shown = 'unknown';
      if (shown === null) {
        ctx.log && ctx.log(`Unresolved variable {{${name}}}`);
        segs.push({ type: 'text', text: NOT_ENTERED, unresolved: name });
        continue;
      }
      segs.push({ type: 'var', name, text: shown, meta: ctx.meta ? ctx.meta[name] : undefined });
    }
  }
  if (last < text.length) segs.push({ type: 'text', text: text.slice(last) });
  return segs;
}

const renderPlain = (text, ctx) => renderSegments(text, ctx).map((s) => s.text).join('');

function factIdsIn(text) {
  const ids = [];
  if (typeof text !== 'string') return ids;
  for (const m of text.matchAll(TOKEN_RE)) if (m[1].startsWith('fact:')) ids.push(m[1].slice(5).split('.')[0]);
  return ids;
}

// Fact ids behind {{fig:...}} tokens for this path's year.
function figIdsIn(text, facts, vars) {
  const ids = [];
  if (typeof text !== 'string') return ids;
  for (const m of text.matchAll(TOKEN_RE)) {
    if (!m[1].startsWith('fig:')) continue;
    const r = resolveFigure(facts, m[1].slice(4), vars.decision_year);
    if (r.ok) ids.push(r.id);
  }
  return ids;
}

// ---------- inputs ----------
function validateInput(node, value) {
  if (value === 'unknown') return node.allow_unknown ? null : 'Please enter a value.';
  if (value === 'default') return node.default_from ? null : 'Please enter a value.';
  if (node.input === 'month') {
    if (!isValidMonth(value)) return 'Please choose a month and year.';
    if (node.validate && node.validate.min && value < node.validate.min) return `Please choose ${formatMonth(node.validate.min)} or later.`;
    if (node.validate && node.validate.max && value > node.validate.max) return `Please choose ${formatMonth(node.validate.max)} or earlier.`;
    return null;
  }
  if (node.input === 'date') return isValidDate(value) ? null : 'Please enter a full date.';
  return null;
}

// ---------- walking ----------
const SCREEN_TYPES = new Set(['info', 'question', 'input', 'outcome', 'calculator', 'summary']);

// Walk from the start node using `answers`. Info/outcome/calculator screens pass through; the walk
// stops at the first unanswered question/input, or at the summary. Only answers on the current
// path (plus option `sets`) become effective, so changing an early answer drops stale later ones.
function walk(tree, answers, facts, today) {
  const byId = Object.fromEntries(tree.nodes.map((n) => [n.id, n]));
  const eff = {};
  const screens = [];
  const routeQuestions = [];
  let id = tree.meta.start;
  let result = null;
  const vars = () => {
    const c = compute(eff, facts, today);
    result = c;
    return { ...eff, ...c.values };
  };
  for (let guard = 0; id && guard < 500; guard++) {
    const node = byId[id];
    if (!node) throw new Error('Missing node ' + id);
    if (SCREEN_TYPES.has(node.type)) screens.push(id);
    if (node.type === 'question' || node.type === 'input') {
      const ans = answers[node.var];
      if (ans === undefined || ans === null || ans === '') return finish(null);
      if (node.type === 'question') {
        const opt = node.options.find((o) => o.value === ans);
        if (!opt) return finish(null);
        eff[node.var] = ans;
        Object.assign(eff, opt.sets || {});
        id = opt.next;
      } else {
        if (validateInput(node, ans)) return finish(null);
        eff[node.var] = ans;
        id = node.next;
      }
    } else if (node.type === 'route' || node.type === 'score') {
      const entry = pickRoute(node.route, vars());
      if (!entry) throw new Error('No route matched at ' + id);
      routeQuestions.push(...(entry.add_questions || []));
      id = entry.next;
    } else if (node.type === 'summary') {
      return finish(id);
    } else {
      id = node.next;
    }
  }
  return finish(null);

  function finish(summaryId) {
    const v = vars();
    return { screens, complete: !!summaryId, effective: { ...eff }, vars: v, meta: result.meta,
      notes: result.notes, engineQuestions: result.questions, routeQuestions };
  }
}

// ---------- actions and questions ----------
const DATE_RULE_RE = /^([a-z_][a-z0-9_]*)(?:([+-])(\d+)([dm]))?$/;

function resolveActionDate(rule, vars, today) {
  const m = DATE_RULE_RE.exec(rule || '');
  if (!m) throw new Error('Bad date_rule: ' + rule);
  const [, name, sign, num, unit] = m;
  const base = name === 'today' ? today : vars[name];
  if (!isValidDate(base)) return { missing: name };
  if (!sign) return { date: base };
  const n = (sign === '-' ? -1 : 1) * +num;
  return { date: unit === 'd' ? addDays(base, n) : addMonths(base, n) };
}

const NEEDS = {
  job_cov_end: 'the month you plan to stop working', partb_start: 'your Part B start date',
  partb_file_by: 'the month you plan to stop working', wife_medicare_start: "your wife's date of birth",
  wife_cobra_end: "your wife's date of birth and when you stop working", irmaa_first_year_jan: 'your Part B start date',
  ssa44_date: 'your Part B start date', drug_enroll_by_no_gap: 'the month you plan to stop working',
  parta_signup_by: 'whether you have Part A', parta_signup_earliest_for_36: 'the month you plan to stop working',
  medigap_window_close: 'your Part B start date', nj_gi_window_close: 'the month you plan to stop working',
  wife_partb_file_by: "your wife's date of birth and when you stop working"
};

function collectPath(tree, w, facts, today) {
  const byId = Object.fromEntries(tree.nodes.map((n) => [n.id, n]));
  const actionIds = [], questionIds = [], factIds = [];
  const push = (arr, xs) => { for (const x of xs || []) if (!arr.includes(x)) arr.push(x); };
  for (const sid of w.screens) {
    const n = byId[sid];
    push(actionIds, n.add_actions);
    push(questionIds, n.add_questions);
    push(factIds, n.fact_refs);
    for (const t of nodeTexts(n, w.vars)) { push(factIds, factIdsIn(t)); push(factIds, figIdsIn(t, facts, w.vars)); }
  }
  push(questionIds, w.routeQuestions);
  push(questionIds, w.engineQuestions);
  push(questionIds, tree.always_include_questions);

  const actions = [];
  const notes = [];
  for (const aid of actionIds) {
    const a = tree.actions[aid];
    if (!evalWhen(a.when, w.vars)) continue; // action applies only on some paths
    const r = resolveActionDate(a.date_rule, w.vars, today);
    push(factIds, a.fact_refs);
    push(factIds, factIdsIn(a.text));
    if (r.missing) {
      if (r.missing === 'gcnj_oe_before_retire') continue; // requirement 8: no qualifying window -> omit
      notes.push({ action: aid, needs: NEEDS[r.missing] || r.missing });
      continue;
    }
    // X2: an action with date_end_rule is a range of months; it sorts by its start.
    const end = a.date_end_rule ? resolveActionDate(a.date_end_rule, w.vars, today).date : null;
    const past = end ? end < today : r.date < today;
    actions.push({ id: aid, date: past ? today : r.date, ruleDate: r.date, past, ...(end ? { range: { start: r.date, end } } : {}), ...a });
  }
  actions.sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0));

  const groups = {};
  for (const qid of questionIds) {
    const q = tree.questions[qid];
    if (!q || !evalWhen(q.when, w.vars)) continue;
    (groups[q.to] = groups[q.to] || []).push({ id: qid, ...q });
    push(factIds, factIdsIn(q.text));
  }
  for (const oi of tree.open_items || []) push(factIds, oi.fact_refs);
  const stale = factIds.filter((id) => facts[id] && isStale(facts[id], today));
  return { actions, notes, questions: groups, factIds, stale };
}

// All renderable strings of a node, including matching variants.
function nodeTexts(n, vars) {
  const out = [n.title, n.text, n.help, ...(n.bullets || [])];
  for (const v of n.variants || []) if (evalWhen(v.when, vars)) out.push(v.text);
  for (const t of n.timeline || []) out.push(t.date, t.text);
  for (const o of n.options || []) out.push(o.label);
  return out.filter((t) => typeof t === 'string');
}

function modulesOf(tree) {
  const mods = [];
  for (const n of tree.nodes) if (n.module && !mods.includes(n.module)) mods.push(n.module);
  return mods;
}

// ---- src/app.js ----
// UI layer: renders the current screen from the interpreter's walk. All math lives in engine.js.



const FACTS_DOC = JSON.parse(document.getElementById('facts-data').textContent);
const TREE = JSON.parse(document.getElementById('tree-data').textContent);
const FACTS = indexFacts(FACTS_DOC);
const BY_ID = Object.fromEntries(TREE.nodes.map((n) => [n.id, n]));
const MODULES = modulesOf(TREE);
const STORE_KEY = 'nj-medicare-guide-answers-v1';
const TAB_KEY = 'nj-medicare-guide-tab-v1'; // this tab only; the browser deletes it when the tab closes
const LOG = [];

// ---------- today (?today=YYYY-MM-DD test hook; never changes facts) ----------
function localToday() {
  const d = new Date();
  return makeDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
const TODAY = (() => {
  try {
    const q = new URLSearchParams(window.location.search).get('today');
    if (q && isValidDate(q)) return q;
  } catch (e) { /* ignore */ }
  return localToday();
})();

// ---------- state + opt-in storage ----------
// Calculator years start empty and default to the path's decision year (the year Part B starts).
const freshState = () => ({ answers: {}, calc: { irmaa: { magi: {}, oneTime: {}, wifeHasB: true },
  medigap: { yearType: 'moderate', year: null, excess: 0 }, penalty: { bMonths: 12, bYear: null, dMonths: 12, dYear: null } }, pos: 0 });
let state = freshState();
let remember = false;

function storageGet() {
  try { const s = window.localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function storageSet() {
  if (!remember) return true;
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; } catch (e) {
    note('Could not save on this device (storage is blocked). The guide still works.');
    return false;
  }
}
function storageClear() {
  try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* storage blocked: nothing saved */ }
  try { window.sessionStorage.removeItem(TAB_KEY); } catch (e) { /* storage blocked: nothing saved */ }
}
// A refresh or a Back gesture should not lose his place. This copy lives only in this tab (sessionStorage)
// and leaves out the health answer and the income amounts; it is gone when the tab closes.
function tabCopy() {
  const answers = { ...state.answers };
  delete answers.health_needs;
  return { answers, pos: state.pos, calc: { ...state.calc, irmaa: { ...state.calc.irmaa, magi: {}, oneTime: {} } } };
}
function tabSet() {
  try { window.sessionStorage.setItem(TAB_KEY, JSON.stringify(tabCopy())); } catch (e) { /* storage blocked: guide still works */ }
}
function tabGet() {
  try { const s = window.sessionStorage.getItem(TAB_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
// Each screen is a browser history entry, so the phone's Back gesture goes to the previous screen.
function historySet(push) {
  try { window.history[push ? 'pushState' : 'replaceState']({ pos: state.pos }, ''); } catch (e) { /* e.g. some file:// pages */ }
}
function note(msg) { document.getElementById('storage-note').textContent = msg; }

// ---------- DOM helper ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}

// ---------- popovers ----------
const pop = document.getElementById('pop');
function openPop(title, ...content) {
  const body = document.getElementById('pop-body');
  body.replaceChildren(h('h2', { id: 'pop-title' }, title), ...content);
  if (typeof pop.showModal === 'function') pop.showModal(); else pop.setAttribute('open', '');
}
const srcLink = (s, text) => h('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer', class: 'src' }, text || 'Source');

function factDetail(f) {
  const items = [h('p', {}, f.plain)];
  items.push(h('p', {}, h('strong', {}, 'Label: '), f.label, f.confidence ? ` (confidence: ${f.confidence})` : '',
    ' — ', (FACTS_DOC.meta.label_definitions || {})[f.label] || ''));
  if (f.effective) items.push(h('p', {}, h('strong', {}, 'Applies to: '), String(f.effective)));
  if (f.derivation) items.push(h('p', {}, h('strong', {}, 'How we got this: '), f.derivation));
  if (f.note) items.push(h('p', {}, h('strong', {}, 'Note: '), f.note));
  if (f.label === 'PENDING' && f.projection) {
    items.push(h('p', {}, h('strong', {}, 'Projected (not official): '),
      `premium ${formatUSD(f.projection.premium)}, deductible ${formatUSD(f.projection.deductible)}. ${f.projection.basis}`));
  }
  if (isStale(f, TODAY)) items.push(h('p', { class: 'stale' }, 'This number may be out of date — check the source.'));
  if (f.review_after) items.push(h('p', { class: 'small' }, `Check again after ${formatDate(f.review_after)}.`));
  if (f.source) items.push(h('p', {}, srcLink(f.source, f.source.title)));
  for (const a of f.also || []) items.push(h('p', {}, 'Also: ', srcLink(a, a.title)));
  return items;
}

function badgeForFact(f) {
  return h('button', { type: 'button', class: 'badge ' + f.label,
    'aria-label': `${f.label}${f.confidence ? ', ' + f.confidence + ' confidence' : ''}: details for "${f.plain.slice(0, 60)}"`,
    onclick: () => openPop('About this fact', ...factDetail(f)) },
  f.label + (f.label === 'UNVERIFIED' && f.confidence ? ` (${f.confidence})` : ''));
}

function factMarks(f) {
  const out = [' ', badgeForFact(f)];
  if (f.source) out.push(srcLink(f.source));
  if (isStale(f, TODAY)) out.push(h('span', { class: 'stale' }, 'This number may be out of date — check the source'));
  return out;
}

function badgeForVar(name, meta) {
  const m = meta || { label: 'INFERRED', how: '' };
  return h('button', { type: 'button', class: 'badge ' + m.label, 'aria-label': `${m.label}: how we got this`,
    onclick: () => openPop('How we got this', h('p', {}, h('strong', {}, m.label), m.confidence ? ` (confidence: ${m.confidence})` : ''),
      h('p', {}, m.how || 'Computed from your answers.'), h('p', { class: 'small' }, 'This is an estimate from your answers, not an official figure.')) },
  m.label);
}

// ---------- glossary ----------
const GLOSS = Object.entries(TREE.glossary || {}).map(([key, g]) => {
  const pattern = key === 'take_assignment' ? 'tak(?:e|es|ing) assignment'
    : g.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return { key, ...g, re: new RegExp(`\\b${pattern}\\b`, key === 'ship' || key === 'irmaa' || key === 'cobra' ? '' : 'i') };
});

function glossaryDialog(g) {
  const f = FACTS[g.fact];
  openPop(g.term, h('p', {}, g.text), f ? h('p', { class: 'small' }, 'Related fact: ', f.plain, ...factMarks(f)) : null);
}

function withGlossary(text, used) {
  let parts = [text];
  for (const g of GLOSS) {
    if (used.has(g.key)) continue;
    const next = [];
    let done = false;
    for (const p of parts) {
      if (done || typeof p !== 'string') { next.push(p); continue; }
      const m = g.re.exec(p);
      if (!m) { next.push(p); continue; }
      next.push(p.slice(0, m.index),
        h('button', { type: 'button', class: 'gloss', 'aria-label': `${m[0]}: what this means`, onclick: () => glossaryDialog(g) }, m[0]),
        p.slice(m.index + m[0].length));
      used.add(g.key);
      done = true;
    }
    parts = next;
  }
  return parts;
}

// ---------- rich text ----------
function ctxFor(w) {
  return { facts: FACTS, vars: w.vars, meta: w.meta, log: (m) => { LOG.push(m); console.warn(m); } };
}

function rich(text, ctx, used, opts = {}) {
  const out = [];
  const segs = renderSegments(text, ctx);
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    if (s.type === 'text') out.push(...(opts.noGloss ? [s.text] : withGlossary(s.text, used)));
    else if (s.type === 'fact') {
      const f = FACTS[s.id];
      out.push(h('span', { class: 'fact' }, ...(opts.noGloss ? [s.text] : withGlossary(s.text, used)), ...(opts.noMarks ? [] : factMarks(f))));
    } else {
      // Keep a hyphenated suffix ("17-month") with its number, before the badge.
      const next = segs[i + 1];
      const suffix = next && next.type === 'text' ? (/^-\w+/.exec(next.text) || [''])[0] : '';
      if (suffix) next.text = next.text.slice(suffix.length);
      out.push(h('strong', {}, s.text + suffix));
      if (s.meta && !opts.noMarks) out.push(' ', badgeForVar(s.name, s.meta));
    }
  }
  return out;
}

// Headings hold plain text only (M20): their fact/estimate marks and glossary buttons go on a line below.
function heading(text, ctx, used) {
  const segs = renderSegments(text, ctx);
  const marks = [];
  for (const s of segs) {
    if (s.type === 'fact') marks.push(...factMarks(FACTS[s.id]));
    else if (s.type === 'var' && s.meta) marks.push(h('span', { class: 'mark-label' }, s.text), ' ', badgeForVar(s.name, s.meta), ' ');
  }
  const terms = withGlossary(segs.map((s) => s.text).join(''), used).filter((x) => x instanceof Node);
  return [h('h1', { tabindex: '-1' }, ...rich(text, ctx, used, { noMarks: true, noGloss: true })),
    marks.length || terms.length ? h('p', { class: 'heading-marks' }, ...marks,
      terms.length ? [h('span', { class: 'mark-label' }, 'What these words mean:'), ' ', ...terms.flatMap((b) => [b, ' '])] : null) : null];
}

// Years that have a figure for any of these year-keyed prefixes, plus the decision year.
function yearsFor(prefixes, extra) {
  const ys = new Set(extra);
  for (const id of Object.keys(FACTS)) for (const p of prefixes) { const m = new RegExp('^' + p + '_(\\d{4})$').exec(id); if (m) ys.add(+m[1]); }
  return [...ys].sort();
}

// ---------- progress / footer ----------
function renderProgress(node) {
  const i = Math.max(0, MODULES.indexOf(node.module));
  const nav = document.getElementById('progress');
  nav.replaceChildren(
    h('p', { class: 'progress-line' }, `Part ${i + 1} of ${MODULES.length}: `, h('strong', {}, node.module)),
    h('div', { class: 'bar', role: 'progressbar', 'aria-label': 'Progress through the guide', 'aria-valuemin': 0,
      'aria-valuemax': MODULES.length, 'aria-valuenow': i + 1 }, h('span', { style: `width:${Math.round(((i + 1) / MODULES.length) * 100)}%` })));
}

function renderFooter() {
  const ship = FACTS.nj_ship_contact;
  document.getElementById('footer').replaceChildren(
    h('p', {}, `Unofficial guide. Not Medicare, CMS or Social Security. Not legal, tax or financial advice. Confirm with NJ SHIP, ${ship.value}.`, ...factMarks(ship)),
    h('p', { class: 'small' }, `Facts as of ${formatDate(FACTS_DOC.meta.as_of)}. Today's date used: ${formatDate(TODAY)}. Nothing you enter leaves this device.`));
}

// ---------- screens ----------
let W = null;

// UX review H1/M3: some screens are not shown on their own. A fork's buttons are drawn on the screen
// before it, and a question answered "assume" automatically (A6b) opens only through a Change button.
function skippable(id) {
  const n = BY_ID[id];
  return !!n && (!!n.fork || (!!n.auto_default && state.answers[n.var] === 'default'));
}

// explicit: open exactly this screen (a Change button), even one that is normally skipped.
function go(pos, fromHistory, explicit) {
  if (!explicit && !fromHistory && W) {
    const dir = pos < state.pos ? -1 : 1;
    while (skippable(W.screens[pos]) && pos + dir >= 0 && pos + dir < W.screens.length) pos += dir;
  }
  state.pos = pos;
  storageSet();
  render(true);
  if (!fromHistory) historySet(true);
}

function answer(node, value) {
  state.answers[node.var] = value;
  const nx = BY_ID[node.next];
  if (nx && nx.auto_default && state.answers[nx.var] === undefined) state.answers[nx.var] = 'default';
  W = walk(TREE, state.answers, FACTS, TODAY);
  const i = W.screens.indexOf(node.id);
  go(i + 1);
}

function navButtons(node, opts = {}) {
  const kids = [];
  const fork = opts.continue && BY_ID[node.next] && BY_ID[node.next].fork ? BY_ID[node.next] : null;
  if (fork) {
    // The fork's question and its two answers replace Continue (never more than 2 primary buttons).
    return h('div', { class: 'fork' }, h('p', { class: 'fork-q' }, renderPlain(fork.text, ctxFor(W))),
      h('div', { class: 'nav' }, fork.options.map((o, k) => h('button', { type: 'button', class: k ? 'secondary' : null,
        onclick: () => answer(fork, o.value) }, renderPlain(o.label, ctxFor(W))))),
      state.pos > 0 ? h('div', { class: 'nav' }, h('button', { type: 'button', class: 'secondary', onclick: () => go(state.pos - 1) }, 'Back')) : null);
  }
  if (state.pos > 0) kids.push(h('button', { type: 'button', class: 'secondary', onclick: () => go(state.pos - 1) }, 'Back'));
  if (opts.continue) kids.push(h('button', { type: 'button', onclick: () => go(state.pos + 1) }, opts.continueLabel || 'Continue'));
  return h('div', { class: 'nav' }, kids);
}

function helpToggle(node, ctx, used) {
  if (!node.help) return null;
  return h('details', {}, h('summary', {}, 'Why we ask'), h('p', {}, ...rich(node.help, ctx, used)));
}

function factList(ids, title = 'Facts on this screen') {
  const list = (ids || []).map((id) => FACTS[id]).filter(Boolean);
  if (!list.length) return null;
  return h('details', {}, h('summary', {}, title),
    h('ul', {}, list.map((f) => h('li', {}, f.plain, ...factMarks(f)))));
}

const WHY_NAMES = { health_needs: 'Specialist, ongoing condition or surgery expected', doctor_choice: 'Seeing any doctor or hospital',
  travel: 'Weeks outside New Jersey', predictability: 'Predictable bills', budget_ok: 'Medigap is affordable',
  reversibility: 'Your Medigap window is open and you expect health needs (Medigap is hard to get back into later)' };

function whyList(w) {
  const reasons = w.vars.path_score_reasons || [];
  const optLabel = (name, ans) => {
    const n = TREE.nodes.find((x) => x.var === name);
    const o = n && n.options.find((x) => x.value === ans);
    return o ? renderPlain(o.label, ctxFor(w)) : ans;
  };
  return h('div', { class: 'panel' }, h('h2', {}, 'Why'),
    h('p', { class: 'small' }, 'Plus points lean to Medigap; minus points lean to Medicare Advantage. These weights are a design choice, not a Medicare rule.',
      ...factMarks(FACTS.path_score_weights)),
    h('ul', {}, reasons.map((r) => h('li', {}, `${WHY_NAMES[r.name] || r.name}: ${r.name === 'reversibility' ? 'yes' : optLabel(r.name, r.answer)} → `,
      h('strong', {}, (r.points > 0 ? '+' : '') + r.points)))),
    h('p', {}, h('strong', {}, `Total: ${w.vars.path_score > 0 ? '+' : ''}${w.vars.path_score}`)),
    w.vars.medigap_window_open === 'unknown' ? h('p', {}, 'Your Medigap window could not be checked, so this is treated as a close call.') : null,
    w.vars.medigap_window_open === false ? h('p', {}, 'Your Medigap window has closed and no guaranteed right was found, so the score is not used.') : null);
}

function screenQuestion(node, ctx, used) {
  const current = state.answers[node.var];
  return [
    node.intro && state.pos === 0 ? h('p', { class: 'intro' }, node.intro) : null,
    ...heading(node.text, ctx, used),
    helpToggle(node, ctx, used),
    h('div', { role: 'group', 'aria-label': 'Choose one' },
      node.options.map((o) => h('button', { type: 'button', class: 'option', 'aria-pressed': String(current === o.value),
        onclick: () => answer(node, o.value) }, renderPlain(o.label, ctx)))),
    factList(node.fact_refs),
    navButtons(node)
  ];
}

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function yearRange(node) {
  const y = +TODAY.slice(0, 4);
  if (node.validate) return [+node.validate.min.slice(0, 4), +node.validate.max.slice(0, 4)];
  if (node.var === 'wife_birth') return [y - 75, y - 50];
  if (node.var === 'job_cov_end') return [y, y + 6];
  return [y - 15, y + 1];
}

function screenInput(node, ctx, used) {
  const cur = state.answers[node.var];
  const [y0, y1] = yearRange(node);
  const idp = 'in-' + node.id;
  const sel = (id, label, opts, value) => h('div', {}, h('label', { class: 'field', for: id }, label),
    h('select', { id }, h('option', { value: '' }, 'Choose'), opts.map(([v, t]) => h('option', { value: v, selected: v === value }, t))));
  const curParts = typeof cur === 'string' && /^\d{4}-\d{2}/.test(cur) ? cur.split('-') : [];
  const fields = [sel(idp + '-m', 'Month', MONTHS.map((m, i) => [String(i + 1).padStart(2, '0'), m]), curParts[1])];
  const fullDate = node.input === 'date' && !node.birth_month;
  if (fullDate) fields.push(sel(idp + '-d', 'Day', Array.from({ length: 31 }, (_, i) => [String(i + 1).padStart(2, '0'), String(i + 1)]), curParts[2]));
  const years = [];
  for (let y = y1; y >= y0; y--) years.push([String(y), String(y)]);
  fields.push(sel(idp + '-y', 'Year', years, curParts[0]));
  const err = h('p', { class: 'error', role: 'alert', hidden: true });
  const submit = () => {
    const m = document.getElementById(idp + '-m').value, yv = document.getElementById(idp + '-y').value;
    const d = fullDate ? document.getElementById(idp + '-d').value : null;
    // M2: only the month and year matter, unless she was born on the 1st. Store the 1st or the 15th.
    const first = node.birth_month && document.getElementById(idp + '-first').checked;
    const value = fullDate ? `${yv}-${m}-${d}` : node.birth_month ? `${yv}-${m}-${first ? '01' : '15'}` : `${yv}-${m}`;
    const problem = node.birth_month ? validateInput({ input: 'month' }, `${yv}-${m}`) : validateInput(node, value);
    if (problem) { err.textContent = problem; err.hidden = false; err.focus && err.setAttribute('tabindex', '-1'); err.focus(); return; }
    answer(node, value);
  };
  const extra = [];
  if (node.allow_unknown) extra.push(h('button', { type: 'button', class: 'secondary', onclick: () => answer(node, 'unknown') }, "I don't know"));
  if (node.default_from) extra.push(h('button', { type: 'button', class: 'secondary', onclick: () => answer(node, 'default') }, "I don't know — assume the last day of that month"));
  return [
    ...heading(node.text, ctx, used),
    helpToggle(node, ctx, used),
    h('div', { class: 'row' }, fields),
    node.birth_month ? h('label', { class: 'remember' }, h('input', { type: 'checkbox', id: idp + '-first', checked: curParts[2] === '01' }), ' ', node.first_label) : null,
    node.default_note ? defaultNote(node) : null,
    err,
    h('div', { class: 'nav' }, h('button', { type: 'button', onclick: submit }, 'Save and continue'), extra),
    cur === 'unknown' || cur === 'default' ? h('p', { class: 'small' }, 'Your answer so far: ', cur === 'unknown' ? "I don't know" : 'assume the last day of the month') : null,
    factList(node.fact_refs),
    navButtons(node)
  ];
}

// M3: under A6, say what we assume about the coverage end, with a Change button once A6 is answered.
function defaultNote(node) {
  const nx = BY_ID[node.next];
  const i = W.screens.indexOf(nx && nx.id);
  const a = nx && state.answers[nx.var];
  const shown = a && a !== 'default' ? `Your job health plan ends ${formatDate(a)}.` : node.default_note;
  return h('p', { class: 'small default-note' }, shown, ' ',
    i >= 0 ? h('button', { type: 'button', class: 'secondary', onclick: () => go(i, false, true) }, 'Change') : null);
}

function screenOutcome(node, ctx, used, w) {
  const kids = [...heading(node.title || '', ctx, used)];
  if (node.text) kids.push(h('p', {}, ...rich(node.text, ctx, used)));
  for (const v of node.variants || []) if (evalWhen(v.when, w.vars)) kids.push(h('p', { class: 'panel' }, ...rich(v.text, ctx, used)));
  if (node.bullets) kids.push(h('ul', {}, node.bullets.map((b) => h('li', {}, ...rich(b, ctx, used)))));
  if (node.timeline) {
    const rowDate = (t) => { const s = renderSegments(t.date, ctx).find((x) => x.type === 'var'); return (s && w.vars[s.name]) || '9999'; };
    const rows = [...node.timeline].sort((a, b) => (rowDate(a) < rowDate(b) ? -1 : rowDate(a) > rowDate(b) ? 1 : 0));
    kids.push(h('ol', { class: 'timeline' }, rows.map((t) => {
      const when = renderSegments(t.date, ctx);
      const isPast = when.some((s) => s.type === 'var' && w.vars[s.name] && w.vars[s.name] < TODAY);
      return h('li', { class: t.deadline ? 'deadline' : null }, h('span', { class: 'when' }, ...rich(t.date, ctx, used, { noGloss: true }), isPast ? h('span', { class: 'past' }, ' (this date has passed: act as soon as possible)') : null),
        ...rich(t.text, ctx, used));
    })));
    if (node.id === 'OUT_SIGNUP_TIMELINE') kids.push(penaltyCalc(w));
  }
  if (['OUT_LEAN_MEDIGAP', 'OUT_LEAN_MA', 'OUT_CLOSE_CALL', 'OUT_NO_MEDIGAP_WINDOW'].includes(node.id)) kids.push(whyList(w));
  if (node.calculator === 'MEDIGAP_COMPARE') kids.push(medigapCalc(w));
  if (node.type === 'calculator' && node.calculator === 'IRMAA') kids.push(irmaaCalc(w));
  kids.push(factList(node.fact_refs), navButtons(node, { continue: true }));
  return kids;
}

      h('select', { id: 'mg-year', onchange: (e) => { c.year = +e.target.value; update(); } },
        yearsFor(['partb_deductible', 'parta_deductible'], [dy, ...Object.keys(FACTS.hdg_deductible.value).map(Number)])
          .map((y) => h('option', { value: y, selected: +c.year === y }, String(y) + (y === dy ? ' (your first Medicare year)' : '')))),
      h('p', { class: 'small' }, 'Years without published figures use the latest earlier figure (noted under the table).')),
    out);
}

function irmaaCalc(w) {
  const c = state.calc.irmaa;
  const v = w.vars;
  let partbStart = v.partb_start;
  let assumedStart = false;
  if (!partbStart) { partbStart = `${TODAY.slice(0, 4)}-01-01`; assumedStart = true; }
  const firstYear = yearOf(partbStart);
  const lastYear = firstYear + 3; // four premium years from the first Part B year
  const taxYears = [];
  for (let y = firstYear - 2; y <= lastYear; y++) taxYears.push(y);
  const t = irmaaTableFor(FACTS, firstYear);
  const presets = h('datalist', { id: 'magi-presets' }, (t ? t.table : []).filter((r) => r.joint_magi_max).map((r) => h('option', { value: r.joint_magi_max })));
  const out = h('div', { 'aria-live': 'polite' });
  const update = () => {
    const rows = irmaaSchedule(FACTS, { partbStart, wifeMedicareStart: v.wife_medicare_start, wifeHasB: c.wifeHasB,
      lastWorkMonth: w.effective.last_work_month, magi: c.magi, oneTime: c.oneTime, lastYear });
    const anyPlaceholder = rows.some((r) => r.placeholder);
    const tierText = (r) => (r.missing ? `enter ${r.missing}` : `Tier ${r.tier}`);
    const costText = (r) => (r.missing ? '—' : formatUSD(r.surcharge));
    const appealText = (r) => (r.missing ? '—' : !r.appealable ? 'Not likely to help' : r.appealMissing ? `enter ${r.appealMissing}` : formatUSD(r.appealSurcharge));
    // H9: on narrow screens each premium year is a card (CSS shows cards or the table).
    const cards = h('ul', { class: 'irmaa-cards' }, rows.map((r) => h('li', { class: 'result' },
      h('p', { class: 'card-title' }, `${r.year} premiums`, r.placeholder ? h('span', { class: 'small' }, ` (uses ${r.tableYear} brackets: placeholder)`) : ''),
      h('dl', {},
        h('dt', {}, 'Uses income from'), h('dd', {}, String(r.taxYear)),
        h('dt', {}, 'Income tier'), h('dd', {}, tierText(r)),
        h('dt', {}, 'Months charged (you + wife)'), h('dd', {}, `${r.himMonths} + ${r.wifeMonths}`),
        h('dt', {}, 'Extra cost that year'), h('dd', {}, costText(r)),
        h('dt', {}, 'If you appeal after retiring'), h('dd', {}, appealText(r))),
      r.cliff ? h('p', { class: 'stale' }, `Within ${formatUSD(FACTS.irmaa_cliff_margin.value)} of the next line (${formatUSD(r.cliff.nextMin)}).`) : null)));
    out.replaceChildren(cards,
      h('div', { class: 'table-wrap irmaa-table', tabindex: '0', role: 'region', 'aria-label': 'Results table (scrolls sideways if needed)' }, h('table', {},
        h('caption', { class: 'small' }, 'Extra Medicare premiums (IRMAA) by year, for the people on Medicare in your household'),
        h('thead', {}, h('tr', {}, ['Premium year', 'Uses income from', 'Income tier', 'Months charged (you + wife)', 'Extra cost that year', 'If you appeal after retiring'].map((x) => h('th', { scope: 'col' }, x)))),
        h('tbody', {}, rows.map((r) => h('tr', {},
          h('td', {}, String(r.year), r.placeholder ? h('span', { class: 'small' }, ` (uses ${r.tableYear} brackets: placeholder)`) : ''),
          h('td', {}, String(r.taxYear)),
          h('td', {}, r.missing ? `enter ${r.missing}` : `Tier ${r.tier}`, r.cliff ? h('div', { class: 'stale' },
            `Within ${formatUSD(FACTS.irmaa_cliff_margin.value)} of the next line (${formatUSD(r.cliff.nextMin)}): crossing it costs about ${formatUSD(r.cliff.stepPerPersonYear)} more per person per year`) : ''),
          h('td', {}, `${r.himMonths} + ${r.wifeMonths}`),
          h('td', { class: 'num' }, r.missing ? '—' : formatUSD(r.surcharge)),
          h('td', {}, r.missing ? '—' : !r.appealable ? 'Not likely to help' : r.appealMissing ? `enter ${r.appealMissing}` :
            [formatUSD(r.appealSurcharge), r.appealOneTime ? h('div', { class: 'small' }, `Includes ${formatUSD(r.appealOneTime)} of one-time income, which still counts and can't be appealed.`) : '']))))))
      ,
      h('p', { class: 'small' }, 'Estimates only. ', badgeForVar('irmaa', { label: 'INFERRED', confidence: 'medium',
        how: 'For each premium year, the income from 2 years before sets the tier (fact irmaa_lookback); each person on Medicare that month pays the Part B + Part D surcharge (fact irmaa_per_person). The appeal column uses that year\'s own income estimate (facts lce_attestation, lce_effective).' }),
        anyPlaceholder ? ' Years without official brackets use the latest published table and are placeholders.' : '',
        assumedStart ? ` Your Part B start date is unknown, so this assumes Part B all of ${firstYear} (ASSUMED).` : '',
        ...factMarks(FACTS.irmaa_table_2026), ...factMarks(FACTS.partb_2027_status)));
    storageSet();
  };
  // One collapsible group per tax year; open for the years that set his first two premium years, and any with entries.
  const rowsIn = taxYears.map((y) => h('details', { class: 'taxyear', open: y === firstYear - 2 || y === firstYear - 1 || c.magi[y] !== undefined },
    h('summary', {}, `Income for ${y}`, y + 2 > lastYear ? ' (used only for an appeal)'
      : ` (sets ${y + 2} premiums${y >= firstYear ? '; also used for an appeal' : ''})`),
    h('div', { class: 'row' },
      numInput(`magi-${y}`, `Joint income (MAGI) for ${y}`, c.magi[y], (val) => { if (val === '') delete c.magi[y]; else c.magi[y] = +val; update(); },
        { list: 'magi-presets', step: 1000 }),
      numInput(`one-${y}`, `One-time part of ${y} (Roth conversions, gains)`, c.oneTime[y], (val) => { if (val === '') delete c.oneTime[y]; else c.oneTime[y] = +val; update(); }, { step: 1000 }))));
  update();
  return h('div', { class: 'panel' },
    h('p', {}, 'What counts as income: ', ...rich('{{fact:irmaa_magi_definition}}', ctxFor(w), new Set())),
    h('label', { class: 'remember' }, h('input', { type: 'checkbox', checked: c.wifeHasB, onchange: (e) => { c.wifeHasB = e.target.checked; update(); } }),
      'My wife will have Part B and a drug plan when her Medicare starts'),
    presets, ...rowsIn, out);
}

// ---------- summary ----------
function screenSummary(node, ctx, used, w) {
  const p = collectPath(TREE, w, FACTS, TODAY);
  const kids = [h('h1', { tabindex: '-1' }, node.title), h('p', {}, node.text)];
  if (p.stale.length) kids.push(h('div', { class: 'warn', role: 'note' }, h('strong', {}, 'Some numbers may be out of date. '),
    `${p.stale.length} facts on your path are past their review date. Check the source links before relying on them.`));
  kids.push(h('div', { class: 'nav no-print' }, h('button', { type: 'button', onclick: () => window.print() }, 'Print this page'),
    state.pos > 0 ? h('button', { type: 'button', class: 'secondary', onclick: () => go(state.pos - 1) }, 'Back') : null));

  const outcomes = w.screens.map((id) => BY_ID[id]).filter((n) => n.type === 'outcome');
  kids.push(h('h2', {}, 'Your results'), h('ul', {}, outcomes.map((n) => h('li', {}, renderPlain(n.title, ctx)))));

  // H7: the dates that carry penalties, printed first.
  const deadlines = (TREE.key_deadlines || []).filter((d) => isValidDate(w.vars[d.var]) && evalWhen(d.when, w.vars))
    .map((d) => ({ ...d, date: w.vars[d.var] })).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  if (deadlines.length) {
    kids.push(h('h2', {}, 'Key deadlines'), h('table', { class: 'deadlines' },
      h('thead', {}, h('tr', {}, h('th', { scope: 'col' }, 'Date'), h('th', { scope: 'col' }, 'What happens'))),
      h('tbody', {}, deadlines.map((d) => h('tr', { class: d.deadline ? 'deadline' : null },
        h('td', { class: 'num' }, formatDate(d.date)),
        h('td', {}, d.deadline ? h('strong', {}, 'Deadline: ') : '', renderPlain(d.text, ctx), d.date < TODAY ? ' (this date has passed)' : ''))))),
    h('p', { class: 'small' }, 'Dates are estimates from your answers. Each one is explained, with its source, on the screens before this one.'));
  }

  kids.push(h('h2', {}, 'Your dated to-do list'), h('ul', { class: 'acts' }, p.actions.map((a) => h('li', {},
    // X2: a range of months prints as "Between January 2027 and December 2027", never as one day.
    a.range && !a.past ? h('strong', {}, `Between ${formatMonth(a.range.start.slice(0, 7))} and ${formatMonth(a.range.end.slice(0, 7))}`) : h('strong', {}, a.past ? 'As soon as possible' : formatDate(a.date)),
    a.range && !a.past ? ': ' : ` (${renderPlain(a.when_text, ctx)}${a.past ? `; the suggested date, ${formatDate(a.ruleDate)}, has passed` : ''}): `,
    ...rich(a.text, ctx, used, { noGloss: true }), ...(a.fact_refs || []).map((id) => FACTS[id]).filter(Boolean).flatMap(factMarks)))));
  for (const n of p.notes) kids.push(h('p', { class: 'warn' }, `We need ${n.needs} to compute this: `, renderPlain(TREE.actions[n.action].text, ctx)));

  kids.push(h('h2', {}, 'Questions to ask'));
  for (const who of ['HR', 'NJ SHIP', 'Social Security']) {
    const qs = p.questions[who] || [];
    if (!qs.length) continue;
    kids.push(h('h3', {}, who === 'NJ SHIP' ? `NJ SHIP (${FACTS.nj_ship_contact.value})` : who),
      h('ul', { class: 'qs' }, qs.map((q) => h('li', {}, ...rich(q.text, ctx, used, { noGloss: true })))));
  }

  kids.push(h('h2', {}, 'Open items'), h('ul', {}, (TREE.open_items || []).map((o) => h('li', {}, o.text,
    ...o.fact_refs.map((id) => FACTS[id]).filter(Boolean).flatMap(factMarks)))));

  kids.push(h('h2', {}, 'Sources'), h('ol', {}, p.factIds.map((id) => FACTS[id]).filter(Boolean).map((f) => h('li', {},
    h('span', {}, f.plain), ' ', h('span', { class: 'badge ' + f.label }, f.label), ' ',
    f.source ? h('a', { href: f.source.url, target: '_blank', rel: 'noopener noreferrer' }, f.source.title) : h('span', { class: 'small' }, '(no outside source: ' + f.label.toLowerCase() + ')'),
    isStale(f, TODAY) ? h('span', { class: 'stale' }, ' may be out of date') : ''))));

  kids.push(h('details', { class: 'no-print' }, h('summary', {}, 'Change my answers'),
    h('ul', {}, w.screens.map((id, i) => [BY_ID[id], i]).filter(([n]) => n.type === 'question' || n.type === 'input').map(([n, i]) => {
      const a = state.answers[n.var];
      const shown = n.type === 'question' ? renderPlain((n.options.find((o) => o.value === a) || {}).label || '', ctx)
        : a === 'unknown' ? "I don't know" : a === 'default' ? 'assumed'
        : n.birth_month ? formatMonth(a.slice(0, 7)) + (a.slice(8) === '01' ? ', born on the 1st' : '')
        : renderPlain(`{{${n.var}}}`, { ...ctx, vars: { [n.var]: a } });
      return h('li', {}, renderPlain(n.text, ctx), ' — ', h('strong', {}, shown), ' ',
        h('button', { type: 'button', class: 'secondary', onclick: () => go(i, false, true) }, 'Change'));
    }))));
  return kids;
}

// ---------- render ----------
function render(moveFocus) {
  W = walk(TREE, state.answers, FACTS, TODAY);
  state.pos = Math.min(Math.max(0, state.pos | 0), W.screens.length - 1);
  const node = BY_ID[W.screens[state.pos]];
  const ctx = ctxFor(W);
  const used = new Set();
  let kids;
  if (node.type === 'question') kids = screenQuestion(node, ctx, used);
  else if (node.type === 'input') kids = screenInput(node, ctx, used);
  else if (node.type === 'summary') kids = screenSummary(node, ctx, used, W);
  else kids = screenOutcome(node, ctx, used, W);
  const main = document.getElementById('main');
  main.replaceChildren(...kids.filter(Boolean));
  main.dataset.node = node.id;
  renderProgress(node);
  tabSet();
  if (moveFocus) {
    const h1 = main.querySelector('h1');
    if (h1) h1.focus();
    window.scrollTo(0, 0);
  }
}

function init() {
  const saved = storageGet();
  if (saved && saved.answers) {
    state = { ...freshState(), ...saved, calc: { ...freshState().calc, ...(saved.calc || {}) } };
    remember = true;
    note('Your saved answers were loaded from this device.');
  } else {
    const tab = tabGet();
    if (tab && tab.answers) state = { ...freshState(), ...tab, calc: { ...freshState().calc, ...(tab.calc || {}) } };
  }
  window.addEventListener('popstate', (e) => {
    if (e.state && typeof e.state.pos === 'number') go(e.state.pos, true);
  });
  const box = document.getElementById('remember');
  box.checked = remember;
  box.addEventListener('change', () => {
    remember = box.checked;
    if (remember) { if (storageSet()) note('Your answers will be saved on this device only.'); }
    else { storageClear(); note('Answers are no longer saved on this device.'); }
  });
  // M8: clearing takes a second, deliberate click. No timer: the choice stays until he picks one.
  const clearBtn = document.getElementById('clear');
  const confirmBox = document.getElementById('clear-confirm');
  const hideConfirm = () => { confirmBox.hidden = true; clearBtn.hidden = false; };
  clearBtn.addEventListener('click', () => {
    clearBtn.hidden = true;
    confirmBox.hidden = false;
    document.getElementById('clear-no').focus(); // the safe choice gets focus
  });
  document.getElementById('clear-no').addEventListener('click', () => { hideConfirm(); clearBtn.focus(); });
  document.getElementById('clear-yes').addEventListener('click', () => {
    hideConfirm();
    storageClear();
    remember = false;
    box.checked = false;
    state = freshState();
    note('Your answers were cleared, and saving on this device is off.');
    render(true);
    historySet(false);
  });
  renderFooter();
  render(false);
  historySet(false);
}

init();
window.__guide = { log: LOG, today: TODAY };

})();
</script>
