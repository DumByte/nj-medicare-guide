<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Medicare Decision Guide</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #3d3d3d;
  --line: #8a8a8a;
  --panel: #f3f4f6;
  --accent: #0b4f8a;
  --accent-fg: #ffffff;
  --accent-soft: #e3eef8;
  --focus: #b35c00;
  --danger: #a3161a;
  --v-bg: #e6e6e6; --v-fg: #1a1a1a;
  --u-bg: #ffe08a; --u-fg: #4a3000;
  --i-bg: #cfe3ff; --i-fg: #0a3466;
  --a-bg: #ffd2d2; --a-fg: #7a0000;
  --p-bg: #d9d9d9; --p-fg: #333333;
  --warn-bg: #fff4d6; --warn-line: #8a5a00; --warn-fg: #4a3000;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --fg: #f2f2f2; --muted: #d0d0d0; --line: #8f8f8f; --panel: #1f2328;
    --accent: #7fb8ff; --accent-fg: #0b0b0b; --accent-soft: #15314f; --focus: #ffb35c; --danger: #ff8a8a;
    --v-bg: #3a3a3a; --v-fg: #f2f2f2; --u-bg: #6b5200; --u-fg: #fff3c4; --i-bg: #143d6b; --i-fg: #dcebff;
    --a-bg: #6b1414; --a-fg: #ffe0e0; --p-bg: #444; --p-fg: #eee; --warn-bg: #3a2f10; --warn-line: #e0b34c; --warn-fg: #fff3c4;
  }
}
* { box-sizing: border-box; }
html { font-size: 20px; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.55; }
main, .top, .tools, .footer { max-width: 46rem; margin: 0 auto; padding: 0 16px; }
main { padding-bottom: 1rem; outline: none; }
h1 { font-size: 1.5rem; line-height: 1.3; margin: 0.8rem 0 0.4rem; }
h1:focus { outline: none; }
h2 { font-size: 1.2rem; margin: 1.4rem 0 0.5rem; }
p, li { max-width: 70ch; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 16px; top: 8px; background: var(--bg); padding: 8px; z-index: 5; }
.top { padding-top: 0.6rem; border-bottom: 2px solid var(--line); }
.brand { margin: 0; font-weight: 700; }
.unofficial { font-weight: 400; color: var(--muted); }
.progress-line { margin: 0.3rem 0 0.5rem; color: var(--muted); }
.bar { height: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 0.6rem; }
.bar > span { display: block; height: 100%; background: var(--accent); }
button, .btn { font: inherit; min-height: 48px; padding: 0.5rem 1.1rem; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; }
button.secondary { background: var(--bg); color: var(--accent); }
button.tertiary { background: none; border-color: transparent; color: var(--muted); text-decoration: underline; padding: 0.5rem 0.4rem; }
button.danger { background: var(--danger); border-color: var(--danger); color: var(--bg); }
button.option { display: block; width: 100%; text-align: left; margin: 0.5rem 0; background: var(--bg); color: var(--fg); border-color: var(--line); }
button.option[aria-pressed="true"] { border-color: var(--accent); border-width: 3px; background: var(--accent-soft); font-weight: 700; }
button.option:hover { border-color: var(--accent); }
.nav { display: flex; gap: 0.8rem; flex-wrap: wrap; margin: 1.2rem 0; }
/* Fact and estimate marks: at least 16px text and a 44px tap area (the ::after extends the hit box). */
.badge { font: inherit; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.02em; min-height: 0; padding: 0.1rem 0.45rem; border-radius: 4px; border: 1px solid currentColor; vertical-align: 0.05em; margin: 0 0.2rem; position: relative; }
.badge::after { content: ""; position: absolute; inset: -10px -4px; }
.badge.VERIFIED { background: var(--v-bg); color: var(--v-fg); }
.badge.UNVERIFIED { background: var(--u-bg); color: var(--u-fg); }
.badge.INFERRED { background: var(--i-bg); color: var(--i-fg); }
.badge.ASSUMED { background: var(--a-bg); color: var(--a-fg); }
.badge.PENDING { background: var(--p-bg); color: var(--p-fg); }
span.badge::after { content: none; }
.src { font-size: 0.8rem; margin-right: 0.2rem; display: inline-block; padding: 0.55rem 0.1rem; margin-block: -0.55rem; }
.stale { font-size: 0.9rem; color: var(--warn-fg); background: var(--warn-bg); border: 1px solid var(--warn-line); padding: 0 0.3rem; border-radius: 4px; }
.heading-marks { margin: 0 0 0.8rem; font-size: 0.85rem; color: var(--muted); line-height: 2.2; }
.mark-label { font-weight: 600; color: var(--fg); }
.gloss { font: inherit; background: none; border: none; padding: 0; min-height: 0; color: inherit; text-decoration: underline dotted 2px; text-underline-offset: 3px; cursor: help; position: relative; }
.gloss::after { content: ""; position: absolute; inset: -10px 0; }
details { margin: 0.8rem 0; }
summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; color: var(--accent); font-weight: 600; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 1rem; margin: 1rem 0; }
.warn { background: var(--warn-bg); border: 2px solid var(--warn-line); border-radius: 8px; padding: 0.6rem 1rem; margin: 1rem 0; }
.small { font-size: 0.85rem; color: var(--muted); }
.timeline { list-style: none; padding: 0; }
.timeline li { border-left: 4px solid var(--accent); padding: 0.2rem 0 0.8rem 0.8rem; }
.timeline li.deadline { border-left-color: var(--danger); }
.timeline .when { font-weight: 700; display: block; }
.timeline li.deadline .when::before { content: "Deadline: "; color: var(--danger); }
label.field { display: block; margin: 0.8rem 0 0.2rem; font-weight: 600; }
select, input[type="number"], input[type="text"] { font: inherit; min-height: 48px; padding: 0.3rem 0.5rem; border: 2px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); max-width: 100%; }
.row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: end; }
.row > div { display: flex; flex-direction: column; min-width: 0; }
.error { color: var(--a-fg); background: var(--a-bg); padding: 0.3rem 0.6rem; border-radius: 6px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { border: 1px solid var(--line); padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
th { background: var(--panel); }
td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.deadlines td.num { text-align: left; }
table.deadlines tr.deadline td { background: var(--warn-bg); }
details.taxyear { border: 1px solid var(--line); border-radius: 8px; padding: 0 0.8rem; margin: 0.5rem 0; }
details.taxyear[open] { padding-bottom: 0.6rem; }
/* IRMAA results: cards on narrow screens, the table on wider ones. */
.irmaa-cards { list-style: none; padding: 0; margin: 1rem 0; }
.irmaa-cards .result { border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.8rem; margin: 0 0 0.6rem; }
.irmaa-cards .card-title { font-weight: 700; margin: 0 0 0.3rem; }
.irmaa-cards dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.2rem 0.8rem; margin: 0; }
.irmaa-cards dt { color: var(--muted); }
.irmaa-cards dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.irmaa-table { display: none; }
@media (min-width: 640px) { .irmaa-table { display: block; } .irmaa-cards { display: none; } }
.tools { border-top: 2px solid var(--line); padding-top: 0.6rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
.confirm { display: inline-flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.confirm[hidden] { display: none; }
.remember { display: flex; align-items: center; gap: 0.5rem; min-height: 48px; }
.remember input { width: 28px; height: 28px; }
.footer { padding: 0.8rem 16px 2rem; font-size: 0.9rem; color: var(--muted); }
dialog { max-width: min(40rem, calc(100vw - 32px)); border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
.past { font-weight: 700; }
ul.qs li, ul.acts li { margin-bottom: 0.6rem; }
@media print {
  .no-print, .nav, .tools, .top nav, .skip, button.badge, .heading-marks, .irmaa-cards, .src-hide { display: none !important; }
  .irmaa-table { display: block !important; }
  html { font-size: 13pt; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; word-break: break-all; }
  a.src[href]::after { content: none; }
  .src { display: none; }
  .panel, .warn, table.deadlines tr { break-inside: avoid; }
  h2 { break-after: avoid; }
}

/* UX review: intro line, fork buttons, the coverage-end note under A6 */
.intro { font-size: 1.05rem; margin: 0 0 .6rem; }
.fork { border-top: 1px solid var(--line); margin-top: 1rem; padding-top: .6rem; }
.fork-q { font-weight: 700; margin: 0 0 .4rem; }
.default-note { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }

</style>
</head>
<body>
<a class="skip" href="#main">Skip to the question</a>
<header class="top">
  <p class="brand">Medicare decision guide <span class="unofficial">(unofficial, New Jersey)</span></p>
  <nav id="progress" aria-label="Progress"></nav>
</header>
<main id="main" tabindex="-1"></main>
<section class="tools no-print" aria-label="Your answers on this device">
  <label class="remember"><input type="checkbox" id="remember"> Remember my answers on this device</label>
  <button type="button" id="clear" class="tertiary">Clear my answers</button>
  <span id="clear-confirm" class="confirm" hidden><span>Clear every answer?</span>
    <button type="button" id="clear-yes" class="danger">Yes, clear</button>
    <button type="button" id="clear-no" class="secondary">Cancel</button></span>
  <p id="storage-note" class="small" role="status"></p>
</section>
<footer id="footer" class="footer"></footer>
<dialog id="pop" aria-labelledby="pop-title">
  <div id="pop-body"></div>
  <form method="dialog"><button type="submit" class="secondary">Close</button></form>
</dialog>
<script type="application/json" id="facts-data">{"meta":{"as_of":"2026-11-03","jurisdiction":"New Jersey + federal","label_definitions":{"VERIFIED":"Read directly on a primary source (CMS, Medicare.gov, SSA/POMS, IRS, DOL, HHS, NJ DOBI, NJ SHIP, Get Covered NJ), or 2+ independent originating sources.","UNVERIFIED":"Some evidence, but the primary page was not opened or does not state it directly. Always carries a confidence.","INFERRED":"Derived from VERIFIED facts by stated arithmetic or reasoning. Always carries a confidence and the derivation.","ASSUMED":"Taken without evidence; must be confirmed by the user or a named office.","PENDING":"Official figure not yet published as of meta.as_of. Show the projection only if labeled as a projection."},"display_rule":"Every number or rule shown in the app must reference a fact id below. The UI shows the label badge, confidence (if any), and a link to source.url. Facts past review_after show a 'may be out of date' banner."},"facts":[{"id":"partb_premium_2026","plain":"Standard Part B premium in 2026","value":202.9,"unit":"USD/month","effective":"2026","label":"VERIFIED","source":{"title":"2026 Medicare Parts A & B Premiums and Deductibles (CMS fact sheet, Nov 14, 2025)","url":"https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"},"review_after":"2026-11-20"},{"id":"partb_deductible_2026","plain":"Part B yearly deductible in 2026","value":283,"unit":"USD/year","effective":"2026","label":"VERIFIED","source":{"title":"2026 Medicare Parts A & B Premiums and Deductibles (CMS)","url":"https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"},"review_after":"2026-11-20"},{"id":"parta_deductible_2026","plain":"Part A hospital deductible per benefit period in 2026","value":1736,"unit":"USD","effective":"2026","label":"VERIFIED","source":{"title":"2026 Medicare Parts A & B Premiums and Deductibles (CMS)","url":"https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"},"review_after":"2026-11-20"},{"id":"parta_premium_free","plain":"About 99% of people pay no Part A premium because they (or a spouse) have 40+ quarters of Medicare-covered work","value":"premium-free with 40 quarters","effective":"ongoing","label":"VERIFIED","source":{"title":"2026 Medicare Parts A & B Premiums and Deductibles (CMS)","url":"https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"}},{"id":"partb_2027_status","plain":"The official 2027 Part B premium, deductible and income brackets were not yet published","value":null,"projection":{"premium":209.5,"deductible":292,"basis":"2026 Medicare Trustees Report intermediate projection, as reported by several dated secondary sources; not an official CMS figure"},"effective":"2027","label":"PENDING","source":{"title":"CMS Newsroom (check for '2027 Medicare Parts A & B Premiums and Deductibles')","url":"https://www.cms.gov/about-cms/contact/newsroom"},"note":"Projection label: UNVERIFIED, medium. Replace this fact and irmaa_table_2026 with the 2027 CMS fact sheet when published (expected mid-November 2026).","review_after":"2026-11-20"},{"id":"irmaa_table_2026","plain":"2026 income-related surcharges (IRMAA) for married couples filing jointly","effective":"2026 premiums, based on the tax return from 2 years earlier (normally 2024)","label":"VERIFIED","value":[{"tier":0,"joint_magi_min":0,"joint_magi_max":218000,"partb_total":202.9,"partb_irmaa":0,"partd_irmaa":0},{"tier":1,"joint_magi_min":218001,"joint_magi_max":274000,"partb_total":284.1,"partb_irmaa":81.2,"partd_irmaa":14.5},{"tier":2,"joint_magi_min":274001,"joint_magi_max":342000,"partb_total":405.8,"partb_irmaa":202.9,"partd_irmaa":37.5},{"tier":3,"joint_magi_min":342001,"joint_magi_max":410000,"partb_total":527.5,"partb_irmaa":324.6,"partd_irmaa":60.4},{"tier":4,"joint_magi_min":410001,"joint_magi_max":749999,"partb_total":649.2,"partb_irmaa":446.3,"partd_irmaa":83.3},{"tier":5,"joint_magi_min":750000,"joint_magi_max":null,"partb_total":689.9,"partb_irmaa":487,"partd_irmaa":91}],"boundary_note":"CMS wording: tier 1 is 'greater than $218,000 and less than or equal to $274,000'; tier 4 is 'greater than $410,000 and less than $750,000'; tier 5 is 'greater than or equal to $750,000'. Implement with these exact comparisons.","source":{"title":"2026 Medicare Parts A & B Premiums and Deductibles; 2026 Part D IRMAA (CMS)","url":"https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"},"review_after":"2026-11-20"},{"id":"irmaa_per_person","plain":"IRMAA is charged per person on Medicare. A married couple's joint income sets the tier, and each spouse who has Part B or Part D pays the surcharge.","label":"INFERRED","confidence":"high","derivation":"CMS table is per beneficiary premium; thresholds are applied to joint MAGI for joint filers (irmaa_table_2026). Only beneficiaries enrolled in Part B/Part D pay a premium.","source":{"title":"2026 Medicare Parts A & B Premiums and Deductibles (CMS)","url":"https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"}},{"id":"irmaa_tier_steps","plain":"Extra yearly cost per person for crossing each IRMAA line (2026 amounts, Part B + Part D surcharges)","label":"INFERRED","confidence":"high","value":[{"from_tier":0,"to_tier":1,"usd_per_year":1148.4},{"from_tier":1,"to_tier":2,"usd_per_year":1736.4},{"from_tier":2,"to_tier":3,"usd_per_year":1735.2},{"from_tier":3,"to_tier":4,"usd_per_year":1735.2},{"from_tier":4,"to_tier":5,"usd_per_year":580.8}],"derivation":"(difference in partb_irmaa + difference in partd_irmaa) x 12, from irmaa_table_2026. Corrects the earlier report, which said each line is worth $1,148-$1,736; the top line is worth $580.80.","source":{"title":"2026 Medicare Parts A & B Premiums and Deductibles (CMS)","url":"https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"}},{"id":"irmaa_lookback","plain":"Social Security uses the most recent tax return the IRS can give it, normally the one from 2 years before the premium year, and never one more than 3 years old","label":"VERIFIED","source":{"title":"SSA POMS HI 01101.001 (PY-2 / PY-3) and HI 01194.020 (IRMAA notice text)","url":"https://secure.ssa.gov/poms.nsf/lnx/0601194020"},"also":[{"title":"SSA POMS HI 01101.001","url":"https://secure.ssa.gov/POMS.nsf/lnx/0601101001"}]},{"id":"irmaa_magi_definition","plain":"Income for IRMAA = adjusted gross income (Form 1040 line 11) + tax-exempt interest (line 2a). Only the taxable part of Social Security counts.","label":"VERIFIED","source":{"title":"SSA POMS HI 01101.010 Modified Adjusted Gross Income (TN 36, 12-25)","url":"https://secure.ssa.gov/POMS.NSF/lnx/0601101010"}},{"id":"lce_list","plain":"Only 8 life-changing events qualify for an IRMAA reduction: death of spouse, marriage, divorce/annulment, work reduction, work stoppage, loss of income-producing property, loss of employer pension, employer settlement payment","label":"VERIFIED","source":{"title":"SSA POMS HI 01120.005 Life Changing Events","url":"https://secure.ssa.gov/poms.nsf/lnx/0601120005"}},{"id":"lce_spouse_event","plain":"The event can happen to the beneficiary or to the beneficiary's spouse (so a spouse's retirement can count)","label":"VERIFIED","source":{"title":"SSA POMS HI 01120.005 section A","url":"https://secure.ssa.gov/poms.nsf/lnx/0601120005"}},{"id":"lce_reporter_only","plain":"A reduction applies only to the person who files. Each spouse on Medicare must file separately.","label":"VERIFIED","source":{"title":"SSA POMS HI 01120.005 section A, NOTE","url":"https://secure.ssa.gov/poms.nsf/lnx/0601120005"}},{"id":"lce_attestation","plain":"SSA accepts the person's sworn statement that the event caused the income drop. If the current year's return is not filed, the person gives an income estimate for this year and may give one for next year (otherwise this year's estimate is reused).","label":"VERIFIED","source":{"title":"SSA POMS HI 01120.005 section A","url":"https://secure.ssa.gov/poms.nsf/lnx/0601120005"}},{"id":"lce_effective","plain":"A new decision normally takes effect in January of the year you ask (or your first Part B month). It reaches back to last year only if the event happened October-December and you file by March 31.","label":"VERIFIED","source":{"title":"SSA POMS HI 01120.005 section B","url":"https://secure.ssa.gov/poms.nsf/lnx/0601120005"}},{"id":"lce_nonqualifying","plain":"One-time income does not qualify for a reduction: capital gains from selling property, IRA conversions, cashing bonds, lottery or casino winnings","label":"VERIFIED","source":{"title":"SSA POMS HI 01120.005 section D","url":"https://secure.ssa.gov/poms.nsf/lnx/0601120005"}},{"id":"ssa44_form","plain":"Form SSA-44 is the optional form to report a life-changing event; you can also call SSA at 1-800-772-1213","label":"VERIFIED","source":{"title":"SSA: Request to lower an IRMAA","url":"https://www.ssa.gov/medicare/lower-irmaa"},"also":[{"title":"Form SSA-44 (PDF)","url":"https://www.ssa.gov/forms/ssa-44.pdf"},{"title":"SSA POMS HI 01120.005: Life-changing events (\"the optional Form SSA-44\")","url":"https://secure.ssa.gov/poms.nsf/lnx/0601120005"}],"note":"Opened 2026-11-03 in a browser. The SSA page lists +1 800-772-1213 and says the request can be made online, by fax or mail, or by phone. POMS HI 01120.005 calls Form SSA-44 optional."},{"id":"partb_defer_while_working","plain":"While you (or your spouse) are working and covered by that job's group health plan, you can wait to sign up for Part B with no penalty","label":"VERIFIED","source":{"title":"Medicare.gov: Working past 65","url":"https://www.medicare.gov/basics/get-started-with-medicare/medicare-basics/working-past-65"}},{"id":"employer_size_20","plain":"If the employer has 20 or more employees, its plan pays first and Medicare pays second for a worker 65+ (or a working spouse's dependent 65+). Under 20 employees, Medicare pays first.","label":"VERIFIED","source":{"title":"CMS Medigap Bulletin 04-01 (Mar 2004), section II.B","url":"https://www.cms.gov/medicare/health-plans/medigap/downloads/mdgp0401.pdf"}},{"id":"partb_sep","plain":"Part B Special Enrollment Period: ends 8 months after the job or the job-based coverage ends, whichever comes first. COBRA is not job-based coverage and does not extend it.","label":"VERIFIED","source":{"title":"Medicare.gov: When does Medicare coverage start?","url":"https://www.medicare.gov/basics/get-started-with-medicare/sign-up/when-does-medicare-coverage-start"},"also":[{"title":"Medicare.gov: Working past 65","url":"https://www.medicare.gov/basics/get-started-with-medicare/medicare-basics/working-past-65"}]},{"id":"partb_sep_start_date","plain":"If you sign up for Part B while you still have job coverage, or in the first full month after it ends, Part B can start on the 1st of the month you sign up, or on the 1st of any of the next 3 months that you choose. If you sign up in a later month of the 8-month window, it starts the month after you sign up.","label":"VERIFIED","source":{"title":"42 U.S.C. 1395q(e): Commencement of coverage for special enrollment periods (Cornell LII)","url":"https://www.law.cornell.edu/uscode/text/42/1395q"},"also":[{"title":"Medicare.gov: When does Medicare coverage start?","url":"https://www.medicare.gov/basics/get-started-with-medicare/sign-up/when-does-medicare-coverage-start"}],"note":"Opened 2026-11-03 in a browser. Subsection (e)(1) gives the same-month start, or any of the following three months at your option; (e)(2) covers later months."},{"id":"partb_signup_lead_time","plain":"Medicare advises checking when job coverage ends and signing up about a month earlier to avoid a gap","label":"VERIFIED","source":{"title":"Medicare.gov: Working past 65","url":"https://www.medicare.gov/basics/get-started-with-medicare/medicare-basics/working-past-65"}},{"id":"partb_forms","plain":"If you already have Part A: apply online at SSA or file Form CMS-40B with Form CMS-L564 (employer confirms your job coverage). If you need both A and B: Form CMS-18-F-5 or online.","label":"VERIFIED","source":{"title":"SSA: Sign up for Part B only","url":"https://www.ssa.gov/medicare/sign-up/part-b-only"},"also":[{"title":"Form CMS-40B (PDF)","url":"https://www.cms.gov/Medicare/CMS-Forms/CMS-Forms/Downloads/CMS40B-E.pdf"},{"title":"Form CMS-18-F-5 (PDF)","url":"https://www.cms.gov/files/document/cms-18f5.pdf"}],"note":"CMS-L564 is named on the SSA page; its direct PDF link was not opened. Link to the SSA page for it."},{"id":"gep","plain":"If the 8-month window is missed: sign up January 1-March 31 (General Enrollment Period); coverage starts the next month, and a late penalty may apply","label":"VERIFIED","source":{"title":"Medicare.gov: When does Medicare coverage start?","url":"https://www.medicare.gov/basics/get-started-with-medicare/sign-up/when-does-medicare-coverage-start"}},{"id":"parta_retro","plain":"You can sign up for premium-free Part A any time after 65. Coverage starts 6 months back from when you sign up (or apply for Social Security), but not before the month you turned 65.","label":"VERIFIED","source":{"title":"Medicare.gov: When does Medicare coverage start?","url":"https://www.medicare.gov/basics/get-started-with-medicare/sign-up/when-does-medicare-coverage-start"}},{"id":"partb_penalty","plain":"Part B late penalty: an extra 10% of the standard premium for each full 12 months you could have had Part B but didn't, usually for life. Not charged if you qualify for a Special Enrollment Period.","label":"VERIFIED","example":"24 months late in 2026: $202.90 + 20% = $243.48, billed as $243.50/month","source":{"title":"Medicare.gov: Avoid late enrollment penalties","url":"https://www.medicare.gov/basics/costs/medicare-costs/avoid-penalties"},"value":{"pct_per_full_12_months":10,"round_to":0.1},"value_note":"Structured copy of numbers already stated in this fact's \"plain\" text (added for the app engine; no new claim)."},{"id":"partd_penalty","plain":"Part D late penalty: 1% of the national base premium for each month without creditable drug coverage once a gap reaches 63 days, rounded to $0.10, added for as long as you have Medicare drug coverage","label":"VERIFIED","source":{"title":"Medicare.gov: Avoid late enrollment penalties","url":"https://www.medicare.gov/basics/costs/medicare-costs/avoid-penalties"},"value":{"pct_per_month":1,"gap_days":63,"round_to":0.1},"value_note":"Structured copy of numbers already stated in this fact's \"plain\" text (added for the app engine; no new claim)."},{"id":"partd_sep_effective_date","plain":"A Medicare drug plan joined in a special enrollment period starts on the 1st of the month after you join. When you leave job coverage, you can join while still covered and choose a start date up to 3 months later.","label":"VERIFIED","source":{"title":"42 CFR 423.40(c): Effective dates (Cornell LII)","url":"https://www.law.cornell.edu/cfr/text/42/423.40"},"also":[{"title":"42 CFR 423.38(c)(11): leaving employer coverage to join a Part D plan (Cornell LII)","url":"https://www.law.cornell.edu/cfr/text/42/423.38"}],"note":"Opened 2026-11-03 in a browser. 423.40(c): coverage \"is effective the first day of the calendar month following the month in which the election is made\". 423.38(c)(11)(ii): the person \"may choose an effective date ... no later than up to 3 months after the month in which the election is made\"."},{"id":"partd_base_2026","plain":"National base beneficiary premium (used for the Part D penalty), 2026","value":38.99,"unit":"USD/month","effective":"2026","label":"VERIFIED","source":{"title":"Medicare.gov: Avoid late enrollment penalties","url":"https://www.medicare.gov/basics/costs/medicare-costs/avoid-penalties"}},{"id":"partd_base_2027","plain":"National base beneficiary premium (used for the Part D penalty), 2027","value":41.33,"unit":"USD/month","effective":"2027","label":"VERIFIED","source":{"title":"CMS: Medicare Part D 2027 National Average Monthly Bid Amount Information (Jul 28, 2026)","url":"https://www.cms.gov/newsroom/fact-sheets/medicare-part-d-2027-national-average-monthly-bid-amount-information"}},{"id":"partd_limits_2027","plain":"2027 Part D: maximum deductible $700; yearly out-of-pocket cap on covered drugs $2,400 (2026: $615 and $2,100)","value":{"deductible":700,"oop_cap":2400},"effective":"2027","label":"UNVERIFIED","confidence":"high","note":"CMS 2027 Rate Announcement (Apr 6, 2026) states these are updated by statutory formula, but the Attachment V table with the numbers was not read. Values reported consistently by multiple dated outlets citing that announcement (Kiplinger, Newsweek, Becker's).","source":{"title":"CMS CY 2027 Rate Announcement (PDF), Attachment V","url":"https://www.cms.gov/files/document/2027-announcement.pdf"}},{"id":"creditable_notice","plain":"Your employer plan must tell you in writing each year whether its drug coverage is 'creditable'. Keep it; a Medicare drug plan may ask for it. No Part D penalty as long as you never go 63+ days without creditable drug coverage.","label":"VERIFIED","source":{"title":"Medicare.gov: Working past 65","url":"https://www.medicare.gov/basics/get-started-with-medicare/medicare-basics/working-past-65"}},{"id":"ma_window_new_to_b","plain":"If you have Part A and add Part B later, your window to join a Medicare Advantage plan starts 3 months before you first have both A and B and ends 2 months after","label":"VERIFIED","source":{"title":"Medicare.gov: Joining a plan (Initial Enrollment Period - New to Part B)","url":"https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan"},"note":"Corrects the earlier report, which mentioned only the 2-months-after window."},{"id":"ma_pd_sep_employer_loss","plain":"After leaving employer coverage (including COBRA), you can join a Medicare Advantage or drug plan for 2 full months after the month that coverage ends","label":"VERIFIED","source":{"title":"Medicare.gov: Special Enrollment Periods","url":"https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan/special-enrollment-periods"}},{"id":"medicare_oep","plain":"Medicare Open Enrollment, October 15-December 7: people already on Medicare can switch, join or drop Medicare Advantage and drug plans; changes start January 1. It does not affect Part B sign-up or Medigap.","label":"VERIFIED","source":{"title":"Medicare.gov: Joining a plan","url":"https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan"},"also":[{"title":"NJ SHIP: Important Information (Medigap not tied to fall enrollment)","url":"https://www.nj.gov/humanservices/doas/documents/SHIP_Important_Info.pdf"}]},{"id":"ma_oep","plain":"Medicare Advantage Open Enrollment, January 1-March 31 (and the first 3 months you have Medicare): people in an Advantage plan can switch plans once or go back to Original Medicare","label":"VERIFIED","source":{"title":"Medicare.gov: Joining a plan","url":"https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan"}},{"id":"ma_moop_2027","plain":"2027 Medicare Advantage legal maximum out-of-pocket for covered Part A/B services: $9,850 in-network; $14,800 in- and out-of-network combined (plans can set lower). Drug costs are separate.","value":{"in_network":9850,"combined":14800},"effective":"2027","label":"UNVERIFIED","confidence":"high","note":"From CMS 'Final Contract Year 2027 Standards for Part C Benefits' memo (Apr 22, 2026) as reported by a dated secondary source; the CMS memo itself was not opened. 2026 values ($9,250 / $13,900) are VERIFIED via KFF and Medicare Interactive.","source":{"title":"KFF: Medicare Advantage Out-of-Pocket Limits (2026 values)","url":"https://www.kff.org/medicare/medicare-advantage-out-of-pocket-limits-variation-and-trends/"}},{"id":"ma_requires_partb","plain":"To join a Medicare Advantage plan you must have Part A and be enrolled in Part B, so you keep paying the Part B premium","label":"INFERRED","confidence":"high","derivation":"42 CFR 422.50(a)(1) requires Part A entitlement and Part B enrollment to join; anyone enrolled in Part B owes its premium (fact partb_premium_2026).","source":{"title":"42 CFR 422.50: Eligibility to elect an MA plan (Cornell LII)","url":"https://www.law.cornell.edu/cfr/text/42/422.50"},"note":"Opened 2026-11-03 in a browser."},{"id":"medigap_oep","plain":"Medigap Open Enrollment: a one-time 6 months starting the first month you are 65+ and have Part B. It starts even if you sign up for Part B while still on job coverage. No health questions during this window.","label":"VERIFIED","source":{"title":"Medicare.gov: When can I buy a Medigap policy?","url":"https://www.medicare.gov/health-drug-plans/medigap/ready-to-buy/when"}},{"id":"medigap_needs_ab_no_drugs","plain":"You must have Parts A and B to buy Medigap. Medigap does not cover prescriptions; you need a separate Part D plan. Each spouse needs a separate policy.","label":"VERIFIED","source":{"title":"NJ SHIP: Important Information","url":"https://www.nj.gov/humanservices/doas/documents/SHIP_Important_Info.pdf"}},{"id":"medigap_not_with_ma","plain":"It is illegal for someone to sell you a Medigap policy while you have a Medicare Advantage plan","label":"VERIFIED","source":{"title":"Medicare.gov: When can I buy a Medigap policy?","url":"https://www.medicare.gov/health-drug-plans/medigap/ready-to-buy/when"}},{"id":"nj_underwriting_after_window","plain":"In New Jersey, after your first 6 months of Part B, companies do not have to sell you a Medigap policy; they can look at your health, turn you down, or charge more (except in a guaranteed-issue situation)","label":"VERIFIED","source":{"title":"NJ SHIP: Important Information","url":"https://www.nj.gov/humanservices/doas/documents/SHIP_Important_Info.pdf"}},{"id":"nj_premium_changes","plain":"NJ Medigap premiums can rise each year as you age; ask each company how it uses age. NJ DOBI can approve
